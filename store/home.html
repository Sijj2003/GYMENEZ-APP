<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez Store | Catálogo Oficial</title>
    
    <!-- Hoja de estilos donde colocaste el CSS de los Skeleton Loaders -->
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <!-- (Opcional) Si usas alguna tipografía de Google Fonts, colócala aquí -->
    <style>
        /* Estilos base mínimos para el Layout por si no los tienes en home.css */
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f5f5f7; color: #1d1d1f; }
        .store-navbar { display: flex; justify-content: space-between; align-items: center; padding: 16px 40px; background: rgba(255, 255, 255, 0.8); backdrop-filter: saturate(180%) blur(20px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #e5e5ea; }
        .store-navbar .logo { font-weight: 700; font-size: 1.2rem; letter-spacing: -0.5px; }
        .store-actions button { margin-left: 12px; padding: 8px 16px; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
        .cart-btn { background: #0071e3; color: white; }
        .cart-btn:hover { background: #0077ed; }
        .profile-btn { background: #e8e8ed; color: #1d1d1f; }
        .store-container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .store-header { text-align: center; margin-bottom: 40px; }
        .store-header h1 { font-size: 2.5rem; letter-spacing: -1px; margin-bottom: 8px; }
        .search-bar input { width: 100%; max-width: 500px; padding: 16px 24px; border-radius: 30px; border: 1px solid #d2d2d7; font-size: 1.1rem; outline: none; transition: box-shadow 0.3s; }
        .search-bar input:focus { box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2); border-color: #0071e3; }
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    </style>
</head>
<body>

    <!-- ==============================================================
         Navegación Superior (Navbar)
         ============================================================== -->
    <header class="store-navbar">
        <div class="logo">GYMENEZ STORE</div>
        <div class="store-actions">
            <!-- Botón del carrito que envía al checkout -->
            <button id="cartButton" class="cart-btn" onclick="window.location.href='/store/checkout.html'">
                🛒 Carrito (<span id="cartCount">0</span>)
            </button>
            <button class="profile-btn" onclick="window.location.href='/apps/user/profile.html'">Mi Perfil</button>
        </div>
    </header>

    <!-- ==============================================================
         Contenedor Principal de la Tienda
         ============================================================== -->
    <main class="store-container">
        
        <!-- Buscador Instantáneo -->
        <section class="store-header">
            <h1>Rendimiento a tu alcance</h1>
            <p style="color: #86868b; font-size: 1.1rem; margin-bottom: 24px;">Encuentra lo que necesitas para tu entrenamiento.</p>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Buscar proteínas, accesorios, etc..." autocomplete="off" />
            </div>
        </section>

        <!-- Contenedor del Catálogo (Aquí JS inyectará los skeletons y productos) -->
        <section id="catalogGrid" class="catalog-grid">
            <!-- JS dinámico -->
        </section>

    </main>

    <!-- ==============================================================
         Scripts de Arquitectura (Bloque 1)
         ============================================================== -->
    <!-- 1. store_core.js maneja la intercepción del carrito y protección de rutas -->
    <script src="/static/js/store/store_core.js"></script>
    
    <!-- 2. catalog.js maneja la caché en sessionStorage, los skeletons y el renderizado -->
    <script src="/static/js/store/catalog.js"></script>
    
    <!-- 3. Actualizador visual del carrito al cargar la página -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Lee los elementos que store_core.js guardó previamente
            const cart = JSON.parse(localStorage.getItem('gymenez_cart')) || [];
            
            // Suma las cantidades para mostrar el número real de ítems
            const totalItems = cart.reduce((acc, item) => acc + (item.qty || 1), 0);
            
            document.getElementById('cartCount').innerText = totalItems;
        });
    </script>
</body>
</html>
