<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Cuenta | Gymenez Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/store/home.css">
    <script>tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } }</script>
</head>
<body class="min-h-screen flex flex-col bg-[#030305] text-white pb-20 md:pb-0">

    <!-- NAVBAR SUPERIOR -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <!-- (Pega aquí el mismo Top Nav de home.html) -->
    </nav>

    <main class="pt-24 md:pt-32 flex-grow w-full max-w-7xl mx-auto px-4 md:px-8 mb-12">
        <div class="flex flex-col md:flex-row gap-6 md:gap-8">
            
            <!-- COLUMNA IZQUIERDA: Tarjeta de Usuario -->
            <div class="w-full md:w-1/3 flex flex-col gap-6">
                
                <div class="glass-panel p-6 rounded-[2rem] border border-white/5 text-center relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-24 bg-gradient-to-r from-[#FFC300]/20 to-transparent opacity-50"></div>
                    
                    <div class="w-20 h-20 mx-auto bg-[#0a0a0f] border-2 border-[#FFC300] rounded-full flex items-center justify-center mb-4 relative z-10 shadow-[0_0_20px_rgba(255,195,0,0.3)]">
                        <svg class="w-10 h-10 text-[#FFC300]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    
                    <h2 id="user-fullname" class="text-xl font-[900] uppercase tracking-widest italic skeleton-box w-3/4 mx-auto h-6 rounded mb-2"></h2>
                    <p id="user-email" class="text-xs text-gray-400 font-medium tracking-wider skeleton-box w-1/2 mx-auto h-4 rounded"></p>
                    
                    <button onclick="logout()" class="mt-8 w-full py-3 rounded-xl border border-red-500/30 text-red-400 text-xs font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all">
                        Cerrar Sesión
                    </button>
                </div>

                <!-- Estado del KYC Logístico -->
                <div id="kyc-status-card" class="glass-panel p-5 rounded-2xl border border-white/5 flex items-center justify-between">
                    <div>
                        <p class="text-[10px] uppercase font-bold tracking-widest text-gray-500 mb-1">Perfil Logístico</p>
                        <p id="kyc-status-text" class="text-sm font-black text-white">Verificando...</p>
                    </div>
                    <div id="kyc-status-icon" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">
                        <div class="animate-spin w-4 h-4 border-2 border-[#FFC300] border-t-transparent rounded-full"></div>
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: Órdenes y Actividad -->
            <div class="w-full md:w-2/3">
                <div class="flex justify-between items-end mb-6 border-b border-white/5 pb-4">
                    <h3 class="text-2xl font-[900] uppercase italic tracking-tighter">Historial de <span class="text-[#FFC300]">Compras</span></h3>
                </div>

                <!-- Contenedor de Órdenes -->
                <div id="orders-container" class="space-y-4">
                    <!-- Ejemplo de cómo se vería una orden inyectada por JS -->
                    <div class="glass-panel p-5 rounded-2xl border border-white/5 hover:border-white/20 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <p class="text-[10px] text-[#FFC300] uppercase font-bold tracking-widest mb-1">ORD-109283</p>
                            <p class="text-sm font-black text-white">2 x Productos Oficiales</p>
                            <p class="text-xs text-gray-500 mt-1">Realizado el: 23 Jul, 2026</p>
                        </div>
                        <div class="flex items-center justify-between md:flex-col md:items-end gap-2">
                            <span class="text-lg font-[900] text-white">Bs. 3.060,00</span>
                            <span class="bg-yellow-500/10 text-yellow-500 border border-yellow-500/20 text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded">Verificando Pago</span>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- BOTTOM NAV MÓVIL -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 mobile-bottom-nav">
        <!-- (Pega aquí el mismo Bottom Nav de home.html) -->
    </div>

    <script src="/static/js/store/account.js"></script>
</body>
</html>
