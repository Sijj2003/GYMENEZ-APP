<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Gymenez Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { gymenez: { dark: '#030305', accent: '#FFC300' } } } } }
    </script>
</head>
<body class="selection:bg-[#FFC300] selection:text-black">

    <script>
        // Verificamos si existe el token universal de la App de Fitness
        const authToken = localStorage.getItem('gymenez_auth_token'); 
        if (!authToken) {
            // Si no está logueado, lo mandamos al login universal de la App
            window.location.href = '/login.html?redirect=/store/account.html';
        }
    </script>

    <nav class="fixed w-full z-50 glass-nav border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <a href="/store/home.html" class="flex items-center gap-2 text-gray-400 hover:text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    <span class="text-xs font-bold uppercase tracking-widest">Tienda</span>
                </a>
                <a href="/dashboard" class="text-[10px] font-bold uppercase tracking-wider text-white hover:text-[#FFC300] transition">Ir a Fitness</a>
            </div>
        </div>
    </nav>

    <main class="pt-28 pb-24 px-4 max-w-3xl mx-auto min-h-screen">
        <div class="mb-8">
            <h1 class="text-3xl md:text-4xl font-[900] tracking-tighter italic uppercase text-white">
                Perfil de <span class="text-[#FFC300]">Comprador</span>
            </h1>
            <p class="text-gray-400 text-xs mt-2 font-medium">Requerido por ley para procesar envíos y facturación.</p>
        </div>

        <form id="buyer-profile-form" class="space-y-6">
            
            <div class="glass-panel p-6 md:p-8 rounded-[2rem]">
                <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                    <span class="text-2xl">⚖️</span>
                    <h2 class="text-lg font-[900] tracking-tighter uppercase italic">Identidad Legal (Titular)</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-1">
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Documento</label>
                        <select id="doc-type" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition cursor-pointer">
                            <option value="V">Venezolano (V)</option>
                            <option value="E">Extranjero (E)</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Número de Cédula</label>
                        <input type="text" id="doc-number" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition" placeholder="Ej: 12345678" required>
                    </div>
                </div>

                <div class="mt-4">
                    <label class="block text-[9px] font-black uppercase tracking-widest text-[#FFC300] mb-2">Foto de Cédula (Seguridad Zero Trust)</label>
                    <div class="relative w-full border-2 border-dashed border-white/20 rounded-xl p-6 text-center hover:border-[#FFC300]/50 transition group cursor-pointer" onclick="document.getElementById('cedula-upload').click()">
                        <svg class="w-8 h-8 text-gray-500 mx-auto mb-2 group-hover:text-[#FFC300] transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        <span id="file-name-display" class="text-xs font-bold text-gray-400 group-hover:text-white transition">Toca para subir fotografía frontal...</span>
                        <input type="file" id="cedula-upload" class="hidden" accept="image/*" onchange="document.getElementById('file-name-display').innerText = this.files[0].name">
                    </div>
                </div>
            </div>

            <div class="glass-panel p-6 md:p-8 rounded-[2rem]">
                <div class="flex items-center gap-3 mb-6 border-b border-white/10 pb-4">
                    <span class="text-2xl">📦</span>
                    <h2 class="text-lg font-[900] tracking-tighter uppercase italic">Logística de Envío</h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Estado</label>
                        <select id="ship-state" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition cursor-pointer">
                            <option value="">Selecciona tu Estado...</option>
                            <option value="Bolívar">Bolívar</option>
                            <option value="Distrito Capital">Distrito Capital</option>
                            <option value="Carabobo">Carabobo</option>
                            <option value="Zulia">Zulia</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Municipio</label>
                        <input type="text" id="ship-municipality" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition" placeholder="Ej: Caroní" required>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Ciudad</label>
                        <input type="text" id="ship-city" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition" placeholder="Ej: Puerto Ordaz" required>
                    </div>
                    <div>
                        <label class="block text-[9px] font-black uppercase tracking-widest text-gray-500 mb-2">Agencia Preferida</label>
                        <select id="ship-courier" class="w-full bg-[#0a0a0f] border border-white/10 rounded-xl px-4 py-3 text-sm text-white focus:border-[#FFC300] transition cursor-pointer">
                            <option value="MRW">MRW</option>
                            <option value="Tealca">Tealca</option>
                            <option value="Zoom">Grupo Zoom</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-save" class="w-full bg-[#FFC300] text-black px-8 py-4 rounded-full font-[900] uppercase tracking-wider text-sm hover:bg-yellow-400 transition-all duration-300 shadow-[0_0_20px_rgba(255,195,0,0.3)]">
                Guardar Perfil y Activar Compras
            </button>
            <p id="form-msg" class="text-center text-xs font-bold uppercase tracking-widest mt-4 hidden"></p>

        </form>
    </main>

    <script src="/static/js/store/account.js"></script>
</body>
</html>
