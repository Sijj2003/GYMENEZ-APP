<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Producto | Gymenez Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { gymenez: { dark: '#030305', accent: '#FFC300' } } } } }
    </script>
</head>
<body class="bg-[#030305] selection:bg-[#FFC300] selection:text-black text-white min-h-screen flex flex-col relative pb-20 md:pb-0">

    <!-- ======================================================= -->
    <!-- NAVBAR SUPERIOR (Dinámico) -->
    <!-- ======================================================= -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="w-full px-4 md:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                
                <!-- IZQUIERDA: Botón Volver y Logo -->
                <div class="flex items-center gap-4">
                    <a href="javascript:history.back()" class="p-2 -ml-2 text-gray-400 hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <a href="/store/home.html" class="hidden md:flex items-center leading-none group">
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-[#FFC300] transition-transform group-hover:scale-105">Gym</span>
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-white transition-transform group-hover:scale-105">enez</span>
                        <span class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.3em] text-white/70 ml-2 mt-1">Store</span>
                    </a>
                </div>

                <!-- DERECHA: Iconos Desktop -->
                <div class="flex items-center gap-2 md:gap-6">
                    <button onclick="window.location.href='/store/checkout.html'" class="relative p-2 text-gray-400 hover:text-[#FFC300] transition hidden md:block group">
                        <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cartCountDesktop" class="absolute top-0 right-0 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow-[0_0_10px_rgba(255,195,0,0.5)]">0</span>
                    </button>
                    <a href="/store/account.html" class="hidden md:flex items-center justify-center w-10 h-10 rounded-full bg-white/5 border border-white/10 hover:border-[#FFC300] text-gray-400 hover:text-[#FFC300] transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ======================================================= -->
    <!-- BOTTOM NAV (Exclusivo para Móviles) -->
    <!-- ======================================================= -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 mobile-bottom-nav">
        <div class="flex items-center justify-around h-16 px-2">
            <a href="/store/home.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[9px] font-medium">Inicio</span>
            </a>
            <a href="/store/checkout.html" class="relative flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <div class="relative">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cartCountMobile" class="absolute -top-1 -right-2 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
                </div>
                <span class="text-[9px] font-medium">Bolsa</span>
            </a>
            <a href="/store/account.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[9px] font-medium">Perfil</span>
            </a>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- FICHA DE PRODUCTO -->
    <!-- ======================================================= -->
    <main class="pt-20 md:pt-28 pb-12 px-4 md:px-8 max-w-7xl mx-auto flex-grow w-full">
        
        <!-- Contenedor Principal de Carga -->
        <div id="loading-spinner" class="flex justify-center items-center py-32">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-[#FFC300]"></div>
        </div>

        <!-- Ficha del Producto (Oculta hasta cargar) -->
        <div id="product-container" class="hidden flex-col md:flex-row gap-8 lg:gap-16">
            
            <!-- COLUMNA IZQUIERDA: IMAGEN -->
            <div class="w-full md:w-1/2">
                <div class="relative w-full aspect-square bg-gradient-to-br from-[#0a0a0f] to-[#030305] rounded-[2rem] md:rounded-[3rem] border border-white/5 overflow-hidden flex items-center justify-center p-8 group shadow-2xl">
                    <div class="absolute inset-0 bg-[#FFC300]/5 blur-[80px] z-0"></div>
                    <img id="prod-img" src="" alt="Producto" class="relative z-10 w-full h-full object-contain filter drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] group-hover:scale-105 transition-transform duration-700">
                    
                    <!-- Etiqueta de Descuento -->
                    <div id="prod-discount-badge" class="absolute top-6 left-6 z-20 bg-red-500 text-white text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest hidden shadow-lg shadow-red-500/30">
                        -0%
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: INFO Y COMPRA -->
            <div class="w-full md:w-1/2 flex flex-col justify-center">
                
                <!-- Vendedor / Tienda -->
                <div class="flex items-center gap-2 mb-4">
                    <span id="prod-store" class="text-[9px] md:text-[10px] font-black text-[#FFC300] uppercase tracking-widest border border-[#FFC300]/30 bg-[#FFC300]/10 px-3 py-1.5 rounded-full">Tienda</span>
                </div>

                <!-- Título -->
                <h1 id="prod-title" class="text-3xl md:text-5xl lg:text-6xl font-[900] tracking-tighter uppercase italic leading-none mb-6">Cargando...</h1>
                
                <!-- Precios -->
                <div class="flex items-end gap-4 mb-6">
                    <span id="prod-price" class="text-4xl md:text-5xl font-black text-white">$0.00</span>
                    <span id="prod-old-price" class="text-xl font-bold text-gray-500 line-through mb-1 hidden">$0.00</span>
                </div>

                <div class="w-full h-px bg-white/10 mb-6"></div>

                <!-- Descripción -->
                <h3 class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Descripción del Producto</h3>
                <p id="prod-desc" class="text-sm md:text-base text-gray-300 leading-relaxed mb-8">...</p>

                <!-- Panel de Compra Glassmorphism -->
                <div class="glass-panel p-6 rounded-[2rem] border border-white/10 mt-auto relative z-10">
                    <div class="flex justify-between items-end mb-4">
                        <label class="text-[10px] font-black uppercase tracking-widest text-gray-400">Cantidad</label>
                        <span id="prod-stock" class="text-[10px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-1 rounded">0 disponibles</span>
                    </div>

                    <!-- SELECTOR DE CANTIDAD PROFESIONAL -->
                    <div class="flex flex-col sm:flex-row items-center gap-4 mb-6">
                        <div class="flex items-center bg-[#0a0a0f] border border-white/10 rounded-2xl overflow-hidden h-14 w-full sm:w-auto">
                            <button onclick="updateQty(-1)" class="px-6 text-gray-400 hover:text-[#FFC300] hover:bg-white/5 transition h-full text-2xl font-normal">-</button>
                            <input type="number" id="prod-qty" value="1" min="1" class="w-16 text-center bg-transparent text-white font-black text-lg border-none focus:outline-none pointer-events-none" readonly>
                            <button onclick="updateQty(1)" class="px-6 text-gray-400 hover:text-[#FFC300] hover:bg-white/5 transition h-full text-2xl font-normal">+</button>
                        </div>
                        
                        <div class="flex-grow flex justify-between sm:justify-end items-center w-full sm:w-auto px-2 sm:px-0">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest sm:mr-3">Total:</span>
                            <span id="prod-total-price" class="text-2xl font-black text-[#FFC300] italic">$0.00</span>
                        </div>
                    </div>

                    <!-- Botón Añadir al Carrito -->
                    <button id="btn-add-cart" onclick="addToCart()" class="w-full bg-[#FFC300] text-black h-14 rounded-2xl font-[900] uppercase tracking-widest text-xs md:text-sm hover:bg-yellow-400 hover:scale-[1.02] transition-all flex items-center justify-center gap-3 shadow-[0_0_30px_rgba(255,195,0,0.2)]">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        Agregar a la Bolsa
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Notificación Toast de Éxito -->
    <div id="toast-cart" class="fixed top-20 right-4 md:bottom-5 md:top-auto md:right-5 bg-emerald-500 text-white px-6 py-4 rounded-xl font-bold text-xs md:text-sm shadow-2xl transform translate-x-full md:translate-x-0 md:translate-y-20 opacity-0 transition-all duration-300 z-[100] flex items-center gap-3">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        <span>Producto añadido a tu carrito.</span>
    </div>

    <!-- Scripts de Lógica -->
    <script src="/static/js/store/store_core.js"></script>
    <script src="/static/js/store/product.js"></script>
    
    <!-- Mini script para actualizar los badges basado en tu lógica original -->
    <script>
        function updateVisualCartBadges() {
            const cart = JSON.parse(localStorage.getItem('gymenez_cart')) || [];
            const totalItems = cart.reduce((acc, item) => acc + (item.qty || 1), 0);
            const badgeDesktop = document.getElementById('cartCountDesktop');
            const badgeMobile = document.getElementById('cartCountMobile');
            
            if (badgeDesktop) badgeDesktop.innerText = totalItems;
            if (badgeMobile) {
                badgeMobile.innerText = totalItems;
                if(totalItems > 0) badgeMobile.classList.remove('hidden');
            }
        }
        document.addEventListener('DOMContentLoaded', updateVisualCartBadges);
        // Sobrescribimos o añadimos un listener si tu addToCart en product.js no lo hace
        const originalAddToCart = window.addToCart;
        window.addToCart = function() {
            if(typeof originalAddToCart === 'function') originalAddToCart();
            setTimeout(updateVisualCartBadges, 100); // Pequeño retraso para que guarde primero
        }
    </script>
</body>
</html>
