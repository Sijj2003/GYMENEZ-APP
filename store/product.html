<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Producto | Gymenez Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { gymenez: { dark: '#030305', accent: '#FFC300' } } } } }
    </script>
</head>
<body class="bg-[#030305] selection:bg-[#FFC300] selection:text-black text-white min-h-screen flex flex-col relative pb-20 md:pb-0">

    <!-- ======================================================= -->
    <!-- NAVBAR SUPERIOR (Minimalista y Centrado) -->
    <!-- ======================================================= -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="w-full px-4 md:px-8">
            <div class="flex items-center justify-between h-16 md:h-20 relative">
                
                <!-- IZQUIERDA: Botón Volver y Logo Completo (Visible en PC y Móvil) -->
                <div class="flex items-center gap-2 md:gap-4 flex-shrink-0 z-20">
                    <a href="javascript:history.back()" class="p-2 -ml-2 text-gray-400 hover:text-white transition">
                        <svg class="w-6 h-6 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <a href="/store/home.html" class="flex items-center leading-none group">
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-[#FFC300] transition-transform group-hover:scale-105">Gym</span>
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-white transition-transform group-hover:scale-105">enez</span>
                        <!-- Store ahora siempre es visible -->
                        <span class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.3em] text-white/70 ml-2 mt-1">Store</span>
                    </a>
                </div>

                <!-- CENTRO: Buscador PC (Centrado matemáticamente, invisible en móvil) -->
                <div class="hidden md:block absolute left-1/2 transform -translate-x-1/2 w-full max-w-xl z-10">
                    <div class="w-full relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="search-input" autocomplete="off" class="block w-full pl-12 pr-4 py-2.5 border border-white/10 rounded-full leading-5 bg-[#0a0a0f] text-gray-300 placeholder-gray-500 focus:outline-none focus:border-[#FFC300]/50 transition-all text-sm" placeholder="Buscar productos...">
                        
                        <div id="search-dropdown" class="absolute top-full left-0 right-0 mt-2 bg-[#0a0a0f] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-[100] hidden flex-col max-h-[400px] overflow-y-auto hide-scroll"></div>
                    </div>
                </div>

                <!-- DERECHA: Iconos PC (Ocultos en móvil, el móvil usa la barra de abajo) -->
                <div class="hidden md:flex items-center justify-end gap-6 flex-shrink-0 z-20">
                    <button onclick="window.location.href='/store/checkout.html'" class="relative p-2 text-gray-400 hover:text-[#FFC300] transition group">
                        <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cartCountDesktop" class="absolute top-0 right-0 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                    <a href="/store/account.html" class="flex items-center justify-center w-10 h-10 rounded-full bg-white/5 border border-white/10 hover:border-[#FFC300] text-gray-400 hover:text-[#FFC300] transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ======================================================= -->
    <!-- BOTTOM NAV (Exclusivo para Móviles) -->
    <!-- ======================================================= -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 mobile-bottom-nav">
        <div class="flex items-center justify-around h-16 px-2">
            <a href="/store/home.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[9px] font-medium">Inicio</span>
            </a>
            <button onclick="toggleMobileSearch(true)" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[9px] font-medium">Buscar</span>
            </button>
            <a href="/store/checkout.html" class="relative flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <div class="relative">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cartCountMobile" class="absolute -top-1 -right-2 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
                </div>
                <span class="text-[9px] font-medium">Bolsa</span>
            </a>
            <a href="/store/account.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[9px] font-medium">Perfil</span>
            </a>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- FICHA DE PRODUCTO -->
    <!-- ======================================================= -->
    <main class="pt-20 md:pt-28 pb-12 px-4 md:px-8 max-w-7xl mx-auto flex-grow w-full">
        
        <!-- Carga -->
        <div id="loading-spinner" class="flex justify-center items-center py-32">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-white"></div>
        </div>

        <div id="product-container" class="hidden flex-col md:flex-row gap-8 lg:gap-16 items-start">
            
            <!-- COLUMNA IZQUIERDA: IMAGEN (Apple Style / Minimalista) -->
            <div class="w-full md:w-1/2 sticky top-28">
                <!-- Fondo súper limpio, borde muy sutil y bordes muy redondeados -->
                <div class="relative w-full aspect-square bg-[#0a0a0f] rounded-[2rem] md:rounded-[2.5rem] border border-white/5 overflow-hidden flex items-center justify-center p-8 md:p-12 group shadow-2xl">
                    <!-- Detalle de luz tenue superior tipo reflejo de cristal -->
                    <div class="absolute inset-x-0 top-0 h-1/2 bg-gradient-to-b from-white/[0.02] to-transparent pointer-events-none"></div>
                    
                    <!-- Imagen con sombra natural -->
                    <img id="prod-img" src="" alt="Producto" class="relative z-10 w-full h-full object-contain filter drop-shadow-2xl transition-transform duration-500 group-hover:scale-105">
                    
                    <!-- Descuento Minimalista -->
                    <div id="prod-discount-badge" class="absolute top-6 left-6 z-20 bg-white text-black text-[10px] font-black px-3 py-1.5 rounded-full uppercase tracking-widest hidden shadow-md">
                        -0%
                    </div>
                </div>
            </div>

            <!-- COLUMNA DERECHA: INFO Y COMPRA -->
            <div class="w-full md:w-1/2 flex flex-col justify-center">
                
                <div class="flex items-center gap-2 mb-4">
                    <span id="prod-store" class="text-[9px] md:text-[10px] font-black text-gray-400 uppercase tracking-widest border border-white/10 bg-white/5 px-3 py-1.5 rounded-full">Tienda</span>
                </div>

                <h1 id="prod-title" class="text-3xl md:text-5xl lg:text-6xl font-[900] tracking-tighter uppercase italic leading-none mb-4">Cargando...</h1>
                
                <div class="flex items-end gap-4 mb-8">
                    <span id="prod-price" class="text-3xl md:text-4xl font-black text-white">$0.00</span>
                    <span id="prod-old-price" class="text-lg font-bold text-gray-600 line-through mb-1 hidden">$0.00</span>
                </div>

                <!-- Descripción Limpia -->
                <p id="prod-desc" class="text-sm md:text-base text-gray-400 leading-relaxed mb-8 font-medium">...</p>

                <!-- ========================================== -->
                <!-- CONSTRUCTOR DE VARIANTES VISUAL (APPLE STYLE) -->
                <!-- ========================================== -->
                <div id="variants-container" class="hidden mb-8 border-t border-white/5 pt-6">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-4">Opciones Disponibles</h3>
                    <div id="variants-list" class="flex flex-wrap gap-3">
                        <!-- Las píldoras de variantes se inyectan por product.js -->
                    </div>
                </div>

                <!-- ========================================== -->
                <!-- PANEL DE COMPRA TIPO APPLE (Píldora Central) -->
                <!-- ========================================== -->
                <div class="bg-[#0a0a0f] p-6 md:p-8 rounded-[2rem] border border-white/5 mt-auto relative z-10 shadow-xl">
                    
                    <!-- Resumen Arriba -->
                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 block mb-1">Total a pagar</span>
                            <span id="prod-total-price" class="text-2xl font-black text-[#FFC300]">$0.00</span>
                        </div>
                        <div class="text-right">
                            <span id="prod-stock" class="text-[9px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-500/10 px-2 py-1 rounded-md">Calculando...</span>
                        </div>
                    </div>

                    <!-- SELECTOR DE CANTIDAD CENTRADO (Diseño Píldora) -->
                    <div class="flex flex-col items-center w-full mb-6">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-600 mb-3">Seleccionar Cantidad</label>
                        <div class="flex items-center justify-between bg-[#12121a] border border-white/10 rounded-full overflow-hidden h-14 w-full max-w-[220px]">
                            <button onclick="updateQty(-1)" class="w-1/3 flex justify-center items-center text-gray-400 hover:text-white transition h-full text-2xl font-light">-</button>
                            <input type="number" id="prod-qty" value="1" min="1" class="w-1/3 text-center bg-transparent text-white font-bold text-xl border-none focus:outline-none pointer-events-none" readonly>
                            <button onclick="updateQty(1)" class="w-1/3 flex justify-center items-center text-gray-400 hover:text-white transition h-full text-2xl font-light">+</button>
                        </div>
                    </div>

                    <!-- Botón de Acción Sólido y Limpio (Deshabilitado por defecto hasta seleccionar variante) -->
                    <button id="btn-add-cart" onclick="addToCart()" disabled class="w-full bg-[#FFC300] text-black h-14 rounded-full font-[900] uppercase tracking-widest text-xs hover:bg-yellow-400 hover:scale-[1.02] transition-all flex items-center justify-center gap-2 shadow-[0_10px_30px_rgba(255,195,0,0.3)] disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:shadow-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        Añadir a la Bolsa
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- ======================================================= -->
    <!-- MODAL DE BÚSQUEDA MÓVIL NATAL -->
    <!-- ======================================================= -->
    <div id="mobile-search-modal" class="md:hidden fixed inset-0 z-[100] bg-[#030305]/95 backdrop-blur-2xl transition-all duration-300 opacity-0 pointer-events-none flex flex-col">
        <div class="flex items-center px-4 h-20 border-b border-white/10 bg-[#0a0a0f]/50 mt-safe">
            <svg class="w-5 h-5 text-[#FFC300] mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="mobile-search-input" class="w-full bg-transparent text-white text-base focus:outline-none placeholder-gray-600" placeholder="Buscar productos...">
            <button onclick="toggleMobileSearch(false)" class="p-2 ml-2 text-gray-400 hover:text-white bg-white/5 rounded-full transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="mobile-search-results" class="flex-1 overflow-y-auto p-2 space-y-2 pb-24 hide-scroll">
            <div class="text-center py-20 opacity-50">
                <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Escribe para buscar...</p>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- TOAST DE NOTIFICACIÓN (Estilo Apple / Dynamic Island) -->
    <!-- ======================================================= -->
    
    <!-- 1. Dejamos un "fantasma" del toast viejo para que product.js no dé error en la consola -->
    <div id="toast-cart" class="hidden"></div>

    <!-- 2. El NUEVO Toast Premium (Centrado matemáticamente arriba) -->
    <div class="fixed top-12 md:top-24 left-0 w-full flex justify-center z-[100] pointer-events-none">
        <div id="toast-premium" class="transform -translate-y-10 opacity-0 transition-all duration-500 ease-out bg-white/95 backdrop-blur-xl text-black px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_20px_40px_rgba(0,0,0,0.4)] flex items-center gap-3 border border-black/5">
            <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            <span>Añadido a la bolsa</span>
        </div>
    </div>

    <!-- Scripts de Lógica -->
    <script src="/static/js/store/store_core.js"></script>
    <script src="/static/js/store/product.js"></script>
    <script src="/static/js/store/search.js?v=1.0"></script>
    
    <!-- Script unificador de los contadores y animación del Toast -->
    <script>
        // Función para actualizar los numeritos amarillos de la bolsa
        function updateVisualCartBadges() {
            const cart = JSON.parse(localStorage.getItem('gymenez_cart')) || [];
            const totalItems = cart.reduce((acc, item) => acc + (item.qty || item.quantity || 1), 0);
            const badgeDesktop = document.getElementById('cartCountDesktop');
            const badgeMobile = document.getElementById('cartCountMobile');
            
            if (badgeDesktop) badgeDesktop.innerText = totalItems;
            if (badgeMobile) {
                badgeMobile.innerText = totalItems;
                if(totalItems > 0) badgeMobile.classList.remove('hidden');
                else badgeMobile.classList.add('hidden');
            }
        }
        
        document.addEventListener('DOMContentLoaded', updateVisualCartBadges);
        
        // Interceptamos la acción de agregar al carrito
        const originalAddToCart = window.addToCart;
        window.addToCart = function() {
            // 1. Ejecuta tu código original para guardar el producto
            if(typeof originalAddToCart === 'function') originalAddToCart();
            
            // 2. Actualiza la bolsa casi al instante
            setTimeout(updateVisualCartBadges, 150); 

            // 3. Dispara la animación de la Píldora (Estilo Apple)
            const toast = document.getElementById('toast-premium');
            if(toast) {
                // Aparece deslizando hacia abajo
                toast.classList.remove('opacity-0', '-translate-y-10');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                // Se esconde después de 2.5 segundos
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-10');
                }, 2500); 
            }
        }
    </script>
</body>
</html>
