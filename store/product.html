<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Producto | Gymenez Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { gymenez: { dark: '#030305', accent: '#FFC300' } } } } }
    </script>
</head>
<body class="bg-[#030305] selection:bg-[#FFC300] selection:text-black text-white min-h-screen flex flex-col relative pb-20 md:pb-0 overflow-x-hidden">

    <!-- Iluminación ambiental de fondo (Efecto Premium) -->
    <div class="fixed top-0 left-0 w-full h-full pointer-events-none z-0 flex justify-center items-start opacity-30">
        <div class="w-[800px] h-[800px] bg-white/5 rounded-full blur-[150px] -translate-y-1/2"></div>
    </div>

    <!-- ======================================================= -->
    <!-- NAVBAR SUPERIOR -->
    <!-- ======================================================= -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300 border-b border-white/5 bg-[#030305]/80 backdrop-blur-md">
        <div class="w-full max-w-7xl mx-auto px-4 md:px-8">
            <div class="flex items-center justify-between h-16 md:h-20 relative">
                
                <!-- IZQUIERDA: Logo -->
                <div class="flex items-center gap-3 md:gap-4 flex-shrink-0 z-20 md:w-1/3">
                    <a href="javascript:history.back()" class="p-2 -ml-2 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-full transition flex items-center justify-center">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                    </a>
                    <a href="/store/home.html" class="flex items-center leading-none group">
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-[#FFC300] transition-transform group-hover:scale-105">Gym</span>
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-white transition-transform group-hover:scale-105">enez</span>
                    </a>
                </div>

                <!-- CENTRO: Buscador PC -->
                <div class="hidden md:block absolute left-1/2 transform -translate-x-1/2 w-full max-w-lg z-10">
                    <div class="w-full relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </div>
                        <input type="text" id="search-input" autocomplete="off" class="block w-full pl-12 pr-4 py-2.5 border border-white/10 hover:border-white/20 rounded-full leading-5 bg-[#0a0a0f] text-gray-300 placeholder-gray-500 focus:outline-none focus:border-[#FFC300]/50 transition-all text-sm shadow-inner" placeholder="Buscar productos...">
                        <div id="search-dropdown" class="absolute top-full left-0 right-0 mt-2 bg-[#0a0a0f] border border-white/10 rounded-2xl shadow-2xl overflow-hidden z-[100] hidden flex-col max-h-[400px] overflow-y-auto hide-scroll"></div>
                    </div>
                </div>

                <!-- DERECHA: Iconos PC -->
                <div class="hidden md:flex items-center justify-end gap-6 flex-shrink-0 z-20 md:w-1/3">
                    <button onclick="window.location.href='/store/checkout.html'" class="relative p-2 text-gray-400 hover:text-[#FFC300] transition group">
                        <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cartCountDesktop" class="absolute top-0 right-0 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full shadow-[0_0_10px_rgba(255,195,0,0.5)]">0</span>
                    </button>
                    <a href="/store/account.html" class="flex items-center justify-center w-10 h-10 rounded-full bg-white/5 border border-white/10 hover:border-[#FFC300] text-gray-400 hover:text-[#FFC300] transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ======================================================= -->
    <!-- BOTTOM NAV (Exclusivo para Móviles) -->
    <!-- ======================================================= -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 mobile-bottom-nav bg-[#030305]/95 backdrop-blur-md border-t border-white/10">
        <div class="flex items-center justify-around h-16 px-2">
            <a href="/store/home.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[9px] font-medium">Inicio</span>
            </a>
            <button onclick="toggleMobileSearch(true)" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[9px] font-medium">Buscar</span>
            </button>
            <a href="/store/checkout.html" class="relative flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <div class="relative">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                    <span id="cartCountMobile" class="absolute -top-1 -right-2 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
                </div>
                <span class="text-[9px] font-medium">Bolsa</span>
            </a>
            <a href="/store/account.html" class="flex flex-col items-center justify-center w-full h-full text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span class="text-[9px] font-medium">Perfil</span>
            </a>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- FICHA DE PRODUCTO PRINCIPAL -->
    <!-- ======================================================= -->
    <main class="pt-24 md:pt-32 pb-12 px-4 md:px-8 max-w-7xl mx-auto w-full flex-grow relative z-10">
        
        <!-- Carga -->
        <div id="loading-spinner" class="flex flex-col justify-center items-center py-32 h-[50vh]">
            <div class="w-12 h-12 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin mb-4"></div>
            <span class="text-[10px] font-black uppercase tracking-widest text-gray-500">Cargando producto...</span>
        </div>

        <!-- ESTRUCTURA DE GRILLA ESTRICTA (Evita solapamientos) -->
        <div id="product-container" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-16 w-full">
            
            <!-- ===================================== -->
            <!-- COLUMNA IZQUIERDA: IMAGEN DEL PRODUCTO -->
            <!-- ===================================== -->
            <div class="lg:col-span-6 w-full flex flex-col justify-start">
                <div class="relative w-full aspect-square bg-gradient-to-tr from-[#0a0a0f] to-[#12121a] rounded-[2rem] md:rounded-[3rem] border border-white/10 flex items-center justify-center p-8 md:p-14 shadow-2xl overflow-hidden group">
                    
                    <!-- Brillo de fondo sutil detrás del producto -->
                    <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div class="w-3/4 h-3/4 bg-white/5 rounded-full blur-[80px]"></div>
                    </div>
                    
                    <!-- Etiqueta de Descuento Absoluta -->
                    <div id="prod-discount-badge" class="absolute top-6 right-6 md:top-8 md:right-8 z-20 bg-red-600 text-white text-[10px] font-black px-4 py-2 rounded-full uppercase tracking-widest hidden shadow-[0_10px_20px_rgba(220,38,38,0.3)] border border-red-500">
                        -0% OFF
                    </div>

                    <!-- Imagen (Sin comportamiento sticky) -->
                    <img id="prod-img" src="" alt="Producto" class="relative z-10 w-full h-full object-contain filter drop-shadow-[0_30px_30px_rgba(0,0,0,0.6)] transition-transform duration-700 group-hover:scale-105">
                </div>
            </div>

            <!-- ===================================== -->
            <!-- COLUMNA DERECHA: INFORMACIÓN Y ACCIONES -->
            <!-- ===================================== -->
            <div class="lg:col-span-6 w-full flex flex-col">
                
                <!-- SECCIÓN 1: Encabezado (Tienda, Título y Precio) -->
                <div class="border-b border-white/10 pb-8 mb-8">
                    <div class="flex items-center gap-3 mb-5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="prod-store" class="text-[9px] md:text-[10px] font-black text-gray-400 uppercase tracking-widest bg-white/5 border border-white/10 px-3 py-1.5 rounded-full shadow-inner">Tienda Oficial</span>
                    </div>

                    <h1 id="prod-title" class="text-3xl md:text-5xl lg:text-6xl font-[900] tracking-tighter uppercase italic leading-tight text-white mb-6">Cargando Título...</h1>
                    
                    <div class="flex items-end gap-4">
                        <span id="prod-price" class="text-4xl md:text-5xl font-black text-[#FFC300] drop-shadow-md">$0.00</span>
                        <span id="prod-old-price" class="text-xl font-bold text-gray-500 line-through mb-1 hidden">$0.00</span>
                    </div>
                </div>

                <!-- SECCIÓN 2: Descripción -->
                <div class="mb-8 bg-[#0a0a0f] p-6 rounded-[2rem] border border-white/5">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-3 flex items-center gap-2">
                        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        Información del Producto
                    </h3>
                    <p id="prod-desc" class="text-sm text-gray-300 leading-relaxed font-medium">...</p>
                </div>

                <!-- SECCIÓN 3: Variantes (Oculto por defecto si no tiene) -->
                <div id="variants-container" class="hidden mb-8 bg-[#0a0a0f] p-6 rounded-[2rem] border border-white/5">
                    <h3 class="text-[10px] font-black uppercase tracking-widest text-gray-500 mb-4 flex items-center gap-2">
                        <svg class="w-4 h-4 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                        Opciones Disponibles
                    </h3>
                    <div id="variants-list" class="flex flex-wrap gap-3">
                        <!-- Las píldoras de variantes se inyectan aquí -->
                    </div>
                </div>

                <!-- SECCIÓN 4: Panel de Acción y Compra (Fijo al fondo de su columna) -->
                <div class="mt-auto bg-gradient-to-br from-[#12121a] to-[#0a0a0f] p-8 rounded-[2.5rem] border border-white/10 shadow-2xl">
                    
                    <div class="flex justify-between items-end mb-8 border-b border-white/5 pb-6">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-gray-500 block mb-1">Total Calculado</span>
                            <span id="prod-total-price" class="text-3xl font-[900] italic text-white">$0.00</span>
                        </div>
                        <div class="text-right">
                            <span id="prod-stock" class="text-[9px] font-black uppercase tracking-widest text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-lg shadow-inner">Calculando...</span>
                        </div>
                    </div>

                    <!-- Selector de Cantidad Central -->
                    <div class="flex flex-col items-center w-full mb-8">
                        <label class="text-[10px] font-bold uppercase tracking-widest text-gray-500 mb-3">Cantidad a ordenar</label>
                        <div class="flex items-center justify-between bg-[#030305] border border-white/10 rounded-full overflow-hidden h-16 w-full max-w-[240px] shadow-inner">
                            <button onclick="updateQty(-1)" class="w-1/3 flex justify-center items-center text-gray-500 hover:text-white hover:bg-white/5 transition h-full text-3xl font-light">-</button>
                            <input type="number" id="prod-qty" value="1" min="1" class="w-1/3 text-center bg-transparent text-white font-[900] text-xl border-none focus:outline-none pointer-events-none" readonly>
                            <button onclick="updateQty(1)" class="w-1/3 flex justify-center items-center text-gray-500 hover:text-white hover:bg-white/5 transition h-full text-3xl font-light">+</button>
                        </div>
                    </div>

                    <!-- Botón Principal -->
                    <button id="btn-add-cart" onclick="addToCart()" disabled class="w-full bg-gradient-to-r from-[#FFD000] to-[#FFC300] text-black h-16 rounded-full font-[900] uppercase tracking-widest text-xs md:text-sm hover:scale-[1.02] transition-all flex items-center justify-center gap-3 shadow-[0_15px_30px_rgba(255,195,0,0.3)] disabled:opacity-30 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:shadow-none">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        Añadir a la Bolsa
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- ======================================================= -->
    <!-- MODAL DE BÚSQUEDA MÓVIL NATAL -->
    <!-- ======================================================= -->
    <div id="mobile-search-modal" class="md:hidden fixed inset-0 z-[100] bg-[#030305]/95 backdrop-blur-2xl transition-all duration-300 opacity-0 pointer-events-none flex flex-col">
        <div class="flex items-center px-4 h-20 border-b border-white/10 bg-[#0a0a0f]/50 mt-safe">
            <svg class="w-5 h-5 text-[#FFC300] mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="mobile-search-input" class="w-full bg-transparent text-white text-base focus:outline-none placeholder-gray-600" placeholder="¿Qué estás buscando?">
            <button onclick="toggleMobileSearch(false)" class="p-2 ml-2 text-gray-400 hover:text-white bg-white/5 rounded-full transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="mobile-search-results" class="flex-1 overflow-y-auto p-2 space-y-2 pb-24 hide-scroll">
            <div class="text-center py-20 opacity-50">
                <svg class="w-12 h-12 mx-auto text-gray-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <p class="text-[10px] font-black uppercase tracking-widest text-gray-400">Escribe para buscar...</p>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- TOAST DE NOTIFICACIÓN (Estilo Apple / Dynamic Island) -->
    <!-- ======================================================= -->
    <div id="toast-cart" class="hidden"></div>

    <div class="fixed top-12 md:top-24 left-0 w-full flex justify-center z-[100] pointer-events-none">
        <div id="toast-premium" class="transform -translate-y-10 opacity-0 transition-all duration-500 ease-out bg-white/95 backdrop-blur-xl text-black px-6 py-3.5 rounded-full font-bold text-sm shadow-[0_30px_50px_rgba(0,0,0,0.5)] flex items-center gap-3 border border-black/10">
            <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center">
                <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <span class="tracking-wide">Añadido a la bolsa</span>
        </div>
    </div>

    <!-- Scripts de Lógica -->
    <script src="/static/js/store/store_core.js"></script>
    <script src="/static/js/store/product.js"></script>
    <script src="/static/js/store/search.js?v=1.0"></script>
    
    <script>
        function updateVisualCartBadges() {
            const cart = JSON.parse(localStorage.getItem('gymenez_cart')) || [];
            const totalItems = cart.reduce((acc, item) => acc + (item.qty || item.quantity || 1), 0);
            const badgeDesktop = document.getElementById('cartCountDesktop');
            const badgeMobile = document.getElementById('cartCountMobile');
            
            if (badgeDesktop) badgeDesktop.innerText = totalItems;
            if (badgeMobile) {
                badgeMobile.innerText = totalItems;
                if(totalItems > 0) badgeMobile.classList.remove('hidden');
                else badgeMobile.classList.add('hidden');
            }
        }
        
        document.addEventListener('DOMContentLoaded', updateVisualCartBadges);
        
        const originalAddToCart = window.addToCart;
        window.addToCart = function() {
            if(typeof originalAddToCart === 'function') originalAddToCart();
            
            setTimeout(updateVisualCartBadges, 150); 

            const toast = document.getElementById('toast-premium');
            if(toast) {
                toast.classList.remove('opacity-0', '-translate-y-10');
                toast.classList.add('opacity-100', 'translate-y-0');
                
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', '-translate-y-10');
                }, 2500); 
            }
        }
    </script>
</body>
</html>
