<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Detalle de Producto | Gymenez Store</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/store/home.css">
    
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { gymenez: { dark: '#030305', accent: '#FFC300' } } } } }
    </script>
</head>
<body class="selection:bg-[#FFC300] selection:text-black min-h-screen flex flex-col relative pb-20 md:pb-0 bg-[#030305] text-white">

    <!-- COPIA EXACTA DEL NAVBAR SUPERIOR DE HOME.HTML -->
    <nav class="fixed top-0 w-full z-50 glass-nav transition-all duration-300">
        <div class="w-full px-4 md:px-8">
            <div class="flex items-center justify-between h-16 md:h-20">
                <!-- Botón de Volver nativo y Logo -->
                <div class="flex items-center gap-4">
                    <a href="javascript:history.back()" class="p-2 -ml-2 text-gray-400 hover:text-white transition">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    </a>
                    <a href="/store/home.html" class="flex items-center leading-none group hidden md:flex">
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-[#FFC300]">Gym</span>
                        <span class="text-xl md:text-2xl font-[900] tracking-tighter uppercase italic text-white">enez</span>
                        <span class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.3em] text-white/70 ml-2 mt-1">Store</span>
                    </a>
                </div>

                <!-- DERECHA: Iconos Profesionales (Desktop) -->
                <div class="flex items-center gap-2 md:gap-6">
                    <button onclick="window.location.href='/store/checkout.html'" class="relative p-2 text-gray-400 hover:text-[#FFC300] transition hidden md:block group">
                        <svg class="w-6 h-6 transform group-hover:scale-110 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                        <span id="cartCountDesktop" class="absolute top-0 right-0 bg-[#FFC300] text-black text-[9px] font-black w-4 h-4 flex items-center justify-center rounded-full">0</span>
                    </button>
                    <a href="/store/account.html" class="hidden md:flex items-center justify-center w-10 h-10 rounded-full bg-white/5 border border-white/10 hover:border-[#FFC300] text-gray-400 hover:text-[#FFC300] transition">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN PRODUCT CONTENT -->
    <!-- En móvil el padding top es justo para la imagen, en PC damos espacio -->
    <main class="pt-16 md:pt-28 flex-grow w-full max-w-7xl mx-auto px-0 md:px-8 flex flex-col md:flex-row md:gap-12 pb-24 md:pb-12">
        
        <!-- IMAGEN (Edge-to-edge en móvil, Esquinas redondeadas en PC) -->
        <div class="w-full md:w-1/2 aspect-square md:aspect-auto md:h-[600px] bg-gradient-to-b from-[#0a0a0f] to-[#030305] md:rounded-[3rem] md:border border-b border-white/5 relative flex items-center justify-center p-8 overflow-hidden shadow-2xl">
            <!-- Destello de fondo -->
            <div class="absolute inset-0 bg-[#FFC300]/5 blur-[100px]"></div>
            
            <img id="product-image" src="" alt="Producto" class="relative z-10 w-full h-full object-contain filter drop-shadow-[0_20px_20px_rgba(0,0,0,0.8)] skeleton-box">
            
            <span id="product-stock-badge" class="absolute top-6 right-6 z-20 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full backdrop-blur-md hidden">
                En Stock
            </span>
        </div>

        <!-- DETALLES DEL PRODUCTO -->
        <div class="w-full md:w-1/2 px-6 md:px-0 py-8 md:py-4 flex flex-col">
            <div class="mb-6">
                <span id="product-store" class="text-[#FFC300] text-[10px] md:text-xs font-black uppercase tracking-widest mb-2 block skeleton-box w-32 h-4 rounded"></span>
                <h1 id="product-title" class="text-3xl md:text-5xl font-[900] tracking-tighter uppercase italic leading-none mb-4 skeleton-box w-3/4 h-10 rounded"></h1>
                <p id="product-price" class="text-4xl md:text-5xl font-black text-white skeleton-box w-40 h-12 rounded"></p>
            </div>

            <!-- Divisor -->
            <div class="w-full h-px bg-white/5 my-6"></div>

            <div class="mb-8">
                <h3 class="text-xs font-bold uppercase tracking-widest text-gray-500 mb-3">Descripción Oficial</h3>
                <p id="product-desc" class="text-sm md:text-base text-gray-300 leading-relaxed skeleton-box w-full h-24 rounded"></p>
            </div>

            <!-- CONTROLES DE COMPRA (Sticky en móvil) -->
            <div class="mt-auto bg-[#030305] md:bg-transparent fixed md:relative bottom-16 md:bottom-auto left-0 w-full md:w-auto p-4 md:p-0 border-t border-white/10 md:border-none z-40 flex items-center gap-4">
                
                <div class="flex items-center glass-panel rounded-2xl h-14 border-white/10 px-2">
                    <button id="btn-minus" class="p-4 text-gray-400 hover:text-white transition font-bold">-</button>
                    <span id="qty-display" class="font-black text-white w-6 text-center text-lg">1</span>
                    <button id="btn-plus" class="p-4 text-gray-400 hover:text-white transition font-bold">+</button>
                </div>

                <button id="btn-add-cart" class="flex-1 bg-[#FFC300] text-black h-14 rounded-2xl font-[900] uppercase tracking-widest text-xs md:text-sm hover:bg-yellow-400 hover:scale-105 transition-all duration-300 shadow-[0_0_30px_rgba(255,195,0,0.2)]">
                    Añadir a la Bolsa
                </button>
            </div>
        </div>
    </main>

    <!-- COPIA EXACTA DEL BOTTOM NAV DE HOME.HTML (Para Móviles) -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 mobile-bottom-nav">
        <!-- Pega aquí exactamente el mismo div.flex.items-center.justify-around que tienes en home.html -->
    </div>

    <!-- Scripts -->
    <script src="/static/js/store/store_core.js"></script>
    <script src="/static/js/store/product.js"></script>
</body>
</html>
