<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ ADMIN | Consola ON (Streaming)</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(220, 38, 38, 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        
        .chapter-card { transition: all 0.3s ease; }
        
        /* Estilo específico para los inputs del nuevo modal limpio */
        .admin-input {
            background-color: #121218;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            transition: all 0.3s ease;
        }
        .admin-input:focus {
            border-color: #dc2626;
            box-shadow: 0 0 0 1px #dc2626;
            outline: none;
            background-color: #181820;
        }
        .admin-input::placeholder { color: #6b7280; font-weight: 500; }
    </style>
</head>
<body class="bg-[#030305] text-white selection:bg-red-600 selection:text-white min-h-screen flex flex-col font-sans overflow-x-hidden">

    <div id="admin-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none border border-white/10"></div>

    <header class="w-full border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black uppercase tracking-tighter">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                    <span class="text-red-500 text-xs font-mono tracking-widest ml-2">CORE_ON</span>
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="/apps/admin/dashboard.html" class="px-5 py-2 rounded-full border border-white/10 text-gray-400 hover:text-white font-bold text-[10px] uppercase tracking-widest transition">Dashboard</a>
            </div>
        </div>
    </header>

    <div id="admin-spinner" class="flex-grow flex flex-col items-center justify-center py-20">
        <div class="w-8 h-8 border-2 border-white/10 border-t-red-600 rounded-full animate-spin mb-3"></div>
        <p class="text-gray-600 text-[9px] font-black uppercase tracking-widest">Sincronizando Bóveda Cinematográfica...</p>
    </div>

    <main id="admin-panel-content" class="hidden max-w-7xl mx-auto w-full px-6 py-10 flex-grow flex flex-col">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-white/5 pb-6">
            <div>
                <p class="text-red-500 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Director de Contenidos</p>
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Catálogo Streaming</h2>
            </div>
            <button onclick="openFilmModal()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-[10px] font-black uppercase tracking-widest transition shadow-[0_0_20px_rgba(220,38,38,0.3)] transform hover:scale-105">
                + Inyectar Producción
            </button>
        </div>

        <div class="mb-6">
            <input type="text" id="admin-film-search" oninput="triggerFilmSearch()" placeholder="Buscar por título, categoría o clasificación..." class="w-full admin-input px-5 py-4 rounded-xl text-sm font-medium">
        </div>

        <div id="films-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-auto"></div>

    </main>

    <div id="film-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[999] flex items-center justify-center p-4 sm:p-6 opacity-0 pointer-events-none transition-all duration-300">
        
        <div class="w-full max-w-5xl h-[90vh] flex flex-col rounded-[28px] border border-white/10 bg-[#060608] shadow-[0_0_80px_rgba(220,38,38,0.15)] overflow-hidden transform scale-95 transition-transform duration-300" id="film-modal-box">
            
            <div class="flex justify-between items-center border-b border-white/10 p-6 md:px-10 md:py-6 bg-[#060608] z-20 shrink-0">
                <div>
                    <h3 id="modal-film-title" class="text-2xl font-black uppercase tracking-tighter text-white">Nueva Producción</h3>
                    <p class="text-[10px] text-red-500 font-bold tracking-widest uppercase mt-1">Base de Datos: on_films</p>
                </div>
                <button onclick="closeFilmModal()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-gray-400 hover:text-white hover:bg-white/10 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="overflow-y-auto custom-scrollbar flex-grow p-6 md:p-10">
                <form id="film-form" onsubmit="handleFilmSubmit(event)" class="space-y-8">
                    <input type="hidden" id="form-film-id">
                    
                    <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-6 md:p-8">
                        <div class="flex items-center gap-3 mb-6 border-b border-white/5 pb-4">
                            <div class="w-8 h-8 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 font-black text-xs">1</div>
                            <h4 class="text-sm font-black uppercase text-white tracking-widest">Detalles Generales</h4>
                        </div>
                        
                        <div class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">Título de la Producción <span class="text-red-500">*</span></label>
                                    <input type="text" id="form-title" required class="w-full admin-input p-4 rounded-xl text-sm font-bold" placeholder="Ej: Tensión Mecánica Perfecta">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">Categoría <span class="text-red-500">*</span></label>
                                    <select id="form-category" required class="w-full admin-input p-4 rounded-xl text-sm font-bold cursor-pointer">
                                        <option value="Serie">Serie</option>
                                        <option value="Película">Película</option>
                                        <option value="Documental">Documental</option>
                                        <option value="Corto">Corto</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">Año <span class="text-red-500">*</span></label>
                                    <input type="number" id="form-year" required value="2026" class="w-full admin-input p-4 rounded-xl font-mono text-center text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">Edad <span class="text-red-500">*</span></label>
                                    <select id="form-age" required class="w-full admin-input p-4 rounded-xl text-center text-sm font-bold cursor-pointer">
                                        <option value="TP">Todo Público</option>
                                        <option value="12+">12+</option>
                                        <option value="16+">16+</option>
                                        <option value="18+">18+</option>
                                    </select>
                                </div>
                                <div class="col-span-2">
                                    <label class="block text-[10px] text-[#FFC300] font-bold uppercase tracking-wider mb-2 ml-1">Nivel de Acceso (Paywall) <span class="text-red-500">*</span></label>
                                    <select id="form-tier" required class="w-full admin-input border-[#FFC300]/30 p-4 rounded-xl text-[#FFC300] font-black uppercase tracking-widest text-center cursor-pointer">
                                        <option value="BASICO" class="bg-[#121218] text-white">BÁSICO (Libre)</option>
                                        <option value="PLUS" class="bg-[#121218] text-white">PLUS (Plus y Ultra)</option>
                                        <option value="ULTRA" class="bg-[#121218] text-white">ULTRA (Solo Ultra)</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">URL de Portada (Thumbnail) <span class="text-red-500">*</span></label>
                                    <input type="url" id="form-cover" required placeholder="https://images.unsplash.com/..." class="w-full admin-input p-4 rounded-xl text-sky-400 font-mono text-xs">
                                </div>
                                <div>
                                    <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">URL Trailer Youtube (Opcional)</label>
                                    <input type="url" id="form-trailer" placeholder="https://youtube.com/watch?v=..." class="w-full admin-input p-4 rounded-xl text-sky-400 font-mono text-xs">
                                </div>
                            </div>

                            <div>
                                <label class="block text-[10px] text-gray-400 font-bold uppercase tracking-wider mb-2 ml-1">Sinopsis <span class="text-red-500">*</span></label>
                                <textarea id="form-synopsis" required rows="3" class="w-full admin-input p-4 rounded-xl resize-none leading-relaxed text-sm" placeholder="Describe brevemente de qué trata esta producción..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white/[0.02] border border-white/5 rounded-2xl p-6 md:p-8">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6 border-b border-white/5 pb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded-full bg-red-500/10 border border-red-500/20 flex items-center justify-center text-red-500 font-black text-xs">2</div>
                                <div>
                                    <h4 class="text-sm font-black uppercase text-white tracking-widest">Contenido Audiovisual</h4>
                                    <p class="text-[9px] text-gray-500 font-bold tracking-widest mt-0.5 uppercase">Añade 1 o más capítulos/episodios</p>
                                </div>
                            </div>
                            <button type="button" onclick="addChapterRow()" class="px-5 py-2.5 bg-white/5 hover:bg-white/10 text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition border border-white/10">
                                + Añadir Capítulo
                            </button>
                        </div>

                        <div id="chapters-container" class="space-y-4"></div>
                    </div>

                </form>
            </div>

            <div class="border-t border-white/10 bg-[#060608] p-6 md:px-10 shrink-0 flex justify-end gap-4 z-20">
                <button type="button" onclick="closeFilmModal()" class="px-6 py-4 rounded-xl bg-transparent border border-white/10 text-gray-400 hover:text-white hover:bg-white/5 font-black text-xs uppercase tracking-widest transition">Cancelar</button>
                <button type="submit" form="film-form" id="btn-submit-film" class="px-8 py-4 rounded-xl bg-red-600 hover:bg-red-500 text-white font-black text-xs uppercase tracking-[0.15em] transition shadow-[0_0_20px_rgba(220,38,38,0.3)]">Guardar Producción</button>
            </div>

        </div>
    </div>

    <script src="/static/js/admin/admin_middleware.js"></script>
    <script src="/static/js/admin/on.js"></script>
</body>
</html>
