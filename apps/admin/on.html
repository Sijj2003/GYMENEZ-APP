<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez OS | Gymenez ON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: white; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .glass-input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); outline: none; }
        
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-full flex selection:bg-red-500 selection:text-white">

    <div id="message-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center border backdrop-blur-md"></div>

    <!-- COLUMNA IZQUIERDA: CATÁLOGO DE STREAMING -->
    <div class="w-full md:w-[35%] lg:w-[30%] h-full border-r border-white/10 bg-[#0a0a0f]/80 backdrop-blur-xl flex flex-col shrink-0">
        <div class="p-4 md:p-6 border-b border-white/5 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black uppercase tracking-tighter text-white">Gymenez <span class="text-red-500">ON</span></h2>
                <button onclick="openCreateWorkspace()" class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            
            <div class="relative mb-3">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-inventory" placeholder="Buscar episodios o clases..." class="w-full glass-input pl-9 pr-4 py-2.5 rounded-xl text-xs focus:border-red-500">
            </div>

            <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button onclick="filterCategory('')" class="cat-filter px-3 py-1 rounded-lg border border-red-500/30 bg-red-500/10 text-red-400 text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Todos</button>
                <button onclick="filterCategory('Fuerza')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Fuerza</button>
                <button onclick="filterCategory('Cardio & HIIT')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Cardio/HIIT</button>
                <button onclick="filterCategory('Mind & Body')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Mind & Body</button>
                <button onclick="filterCategory('Masterclass')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Masterclass</button>
            </div>
        </div>

        <div id="inventory-list" class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </div>

    <!-- COLUMNA DERECHA: LIENZO DE PUBLICACIÓN -->
    <div class="hidden md:flex flex-1 h-full bg-[#050505] flex-col relative" id="workspace-panel">
        
        <div id="ws-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10 fade-in">
            <div class="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-red-500/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 class="text-xl font-black uppercase tracking-tighter text-white">Estudio de Transmisión</h3>
            <p class="text-xs text-gray-500 font-medium mt-2 max-w-sm">Selecciona o sube un episodio para configurar su estreno en la plataforma.</p>
        </div>

        <div id="ws-video" class="hidden flex-col h-full z-20 fade-in w-full">
            <div class="px-8 py-6 border-b border-white/5 bg-gradient-to-r from-red-900/10 to-transparent shrink-0 flex justify-between items-start">
                <div>
                    <span id="v-cat-badge" class="px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest bg-red-500/10 text-red-400 border border-red-500/20 mb-2 inline-block">Categoría</span>
                    <h2 id="v-header-title" class="text-2xl font-black uppercase tracking-tighter text-white">Nuevo Episodio</h2>
                </div>
                <div class="flex gap-2">
                    <button id="v-btn-delete" onclick="deleteCurrentVideo()" class="hidden px-4 py-2 rounded-xl border border-gray-500/20 bg-gray-500/10 text-gray-400 hover:bg-red-500 hover:text-white hover:border-red-500 text-[9px] font-black uppercase tracking-widest transition-colors">Dar de Baja</button>
                    <button onclick="saveVideo()" id="v-btn-save" class="px-6 py-2 rounded-xl bg-red-600 text-white hover:bg-red-500 hover:scale-105 text-[9px] font-black uppercase tracking-widest transition-transform shadow-[0_0_15px_rgba(239,68,68,0.3)]">Publicar Episodio</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar grid grid-cols-1 xl:grid-cols-2 gap-8">
                
                <!-- Datos del Episodio -->
                <form id="video-form" class="space-y-6">
                    <input type="hidden" id="v-id">
                    <input type="hidden" id="v-is-edit" value="false">

                    <div class="bg-white/[0.02] border border-white/5 p-6 rounded-2xl space-y-4">
                        <div>
                            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Título del Episodio</label>
                            <input type="text" id="v-title" required class="w-full glass-input p-3 rounded-xl text-sm font-black text-white" placeholder="Ej: Clase de HIIT Extremo 01">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Canal / Formato</label>
                                <select id="v-category" class="w-full glass-input p-3 rounded-xl text-[10px] font-bold uppercase bg-[#0a0a0f] text-red-400">
                                    <option value="Fuerza">Fuerza & Musculación</option>
                                    <option value="Cardio & HIIT">Cardio & HIIT</option>
                                    <option value="Mind & Body">Mind & Body (Yoga/Pilates)</option>
                                    <option value="Masterclass">Masterclass (Nutrición/Teoría)</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-[#FFC300] uppercase tracking-widest mb-1.5">Acceso (Tier)</label>
                                <select id="v-tier" class="w-full glass-input p-3 rounded-xl text-[10px] font-bold uppercase bg-[#0a0a0f] text-[#FFC300] border-[#FFC300]/30">
                                    <option value="BASICO">Básico (Todos)</option>
                                    <option value="PLUS">Plus</option>
                                    <option value="ULTRA">Ultra</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">URL de Transmisión (YouTube / Vimeo)</label>
                            <input type="url" id="v-url" required class="w-full glass-input p-3 rounded-xl text-xs font-mono text-sky-400" placeholder="https://youtube.com/watch?v=...">
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Sinopsis del Episodio</label>
                            <textarea id="v-desc" rows="4" class="w-full glass-input p-3 rounded-xl text-xs resize-none" placeholder="Describe lo que el atleta logrará con este video..."></textarea>
                        </div>
                    </div>
                </form>

                <!-- Área de Previsualización -->
                <div class="flex flex-col h-full">
                    <h3 class="text-[10px] font-black uppercase text-gray-500 tracking-widest mb-3">Monitor de Transmisión</h3>
                    <div class="flex-1 w-full bg-black border border-white/10 rounded-2xl flex items-center justify-center overflow-hidden relative group">
                        <!-- Pantalla Estática -->
                        <div id="v-preview-empty" class="text-center">
                            <svg class="w-12 h-12 text-white/10 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                            <span class="text-[9px] font-black text-gray-600 uppercase tracking-widest">Sin Señal</span>
                        </div>
                        
                        <!-- Iframe de Video -->
                        <iframe id="v-preview-iframe" class="hidden absolute inset-0 w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
                    </div>
                    <p class="text-[8px] text-gray-600 font-mono mt-2 text-center uppercase tracking-widest">El video se previsualizará automáticamente al insertar una URL válida de YouTube.</p>
                </div>

            </div>
        </div>

    </div>

    <script src="/static/js/admin/admin_middleware.js?v=2.0"></script>
    <script src="/static/js/admin/on.js?v=2.0"></script>
</body>
</html>
