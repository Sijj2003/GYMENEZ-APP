<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez OS | Gymenez ON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: white; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .glass-input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus { border-color: #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); outline: none; }
        
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-full flex selection:bg-red-500 selection:text-white">

    <div id="message-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center border backdrop-blur-md"></div>

    <!-- COLUMNA IZQUIERDA: CATÁLOGO DE STREAMING -->
    <div class="w-full md:w-[35%] lg:w-[30%] h-full border-r border-white/10 bg-[#0a0a0f]/80 backdrop-blur-xl flex flex-col shrink-0">
        <div class="p-4 md:p-6 border-b border-white/5 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black uppercase tracking-tighter text-white">Gymenez <span class="text-red-500">ON</span></h2>
                <button onclick="openCreateWorkspace()" class="w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_15px_rgba(239,68,68,0.3)]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            
            <div class="relative mb-3">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-inventory" placeholder="Buscar producciones..." class="w-full glass-input pl-9 pr-4 py-2.5 rounded-xl text-xs focus:border-red-500">
            </div>

            <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button onclick="filterCategory('')" class="cat-filter px-3 py-1 rounded-lg border border-red-500/30 bg-red-500/10 text-red-400 text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Todos</button>
                <button onclick="filterCategory('Serie')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Series</button>
                <button onclick="filterCategory('Película')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Películas</button>
                <button onclick="filterCategory('Documental')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Documentales</button>
                <button onclick="filterCategory('Corto')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Cortos</button>
            </div>
        </div>

        <div id="inventory-list" class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-red-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </div>

    <!-- COLUMNA DERECHA: LIENZO DE PUBLICACIÓN -->
    <div class="hidden md:flex flex-1 h-full bg-[#050505] flex-col relative" id="workspace-panel">
        
        <div id="ws-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10 fade-in">
            <div class="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-red-500/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h3 class="text-xl font-black uppercase tracking-tighter text-white">Estudio de Transmisión</h3>
            <p class="text-xs text-gray-500 font-medium mt-2 max-w-sm">Selecciona o crea una producción para configurar sus capítulos y estrenarla en la plataforma.</p>
        </div>

        <div id="ws-video" class="hidden flex-col h-full z-20 fade-in w-full">
            <div class="px-8 py-6 border-b border-white/5 bg-gradient-to-r from-red-900/10 to-transparent shrink-0 flex justify-between items-start">
                <div>
                    <span id="v-cat-badge" class="px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest bg-red-500/10 text-red-400 border border-red-500/20 mb-2 inline-block">Categoría</span>
                    <h2 id="v-header-title" class="text-2xl font-black uppercase tracking-tighter text-white">Nueva Producción</h2>
                </div>
                <div class="flex gap-2">
                    <button id="v-btn-delete" onclick="deleteCurrentVideo()" class="hidden px-4 py-2 rounded-xl border border-gray-500/20 bg-gray-500/10 text-gray-400 hover:bg-red-500 hover:text-white hover:border-red-500 text-[9px] font-black uppercase tracking-widest transition-colors">Dar de Baja</button>
                    <button onclick="saveVideo()" id="v-btn-save" class="px-6 py-2 rounded-xl bg-red-600 text-white hover:bg-red-500 hover:scale-105 text-[9px] font-black uppercase tracking-widest transition-transform shadow-[0_0_15px_rgba(239,68,68,0.3)]">Publicar Producción</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                
                <!-- Datos Generales y Capítulos Ocupan el Centro -->
                <form id="video-form" class="space-y-6 max-w-4xl mx-auto pb-10">
                    <input type="hidden" id="v-id">
                    <input type="hidden" id="v-is-edit" value="false">

                    <!-- Info General -->
                    <div class="bg-white/[0.02] border border-white/5 p-6 rounded-2xl space-y-4">
                        <h4 class="text-[10px] font-black uppercase text-white tracking-widest border-b border-white/5 pb-2">Información General</h4>
                        
                        <div>
                            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Título de la Producción</label>
                            <input type="text" id="v-title" required class="w-full glass-input p-3 rounded-xl text-sm font-black text-white" placeholder="Ej: Tensión Mecánica 101">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Formato</label>
                                <select id="v-category" class="w-full glass-input p-3 rounded-xl text-[10px] font-bold uppercase bg-[#0a0a0f] text-red-400">
                                    <option value="Serie">Serie</option>
                                    <option value="Película">Película</option>
                                    <option value="Documental">Documental</option>
                                    <option value="Corto">Corto</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-[#FFC300] uppercase tracking-widest mb-1.5">Acceso (Tier)</label>
                                <select id="v-tier" class="w-full glass-input p-3 rounded-xl text-[10px] font-bold uppercase bg-[#0a0a0f] text-[#FFC300] border-[#FFC300]/30">
                                    <option value="BASICO">Básico</option>
                                    <option value="PLUS">Plus</option>
                                    <option value="ULTRA">Ultra</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Año</label>
                                <input type="number" id="v-year" value="2026" class="w-full glass-input p-3 rounded-xl text-xs text-center font-mono">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Clasificación</label>
                                <select id="v-age" class="w-full glass-input p-3 rounded-xl text-[10px] font-bold uppercase bg-[#0a0a0f] text-white">
                                    <option value="TP">Todo Público</option>
                                    <option value="12+">12+</option>
                                    <option value="16+">16+</option>
                                    <option value="18+">18+</option>
                                </select>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">URL Portada</label>
                                <input type="url" id="v-cover" required class="w-full glass-input p-3 rounded-xl text-[10px] font-mono text-sky-400" placeholder="https://images.unsplash.com/...">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">URL Trailer (Opcional)</label>
                                <input type="url" id="v-trailer" class="w-full glass-input p-3 rounded-xl text-[10px] font-mono text-sky-400" placeholder="https://youtube.com/...">
                            </div>
                        </div>

                        <div>
                            <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Sinopsis</label>
                            <textarea id="v-desc" rows="3" class="w-full glass-input p-3 rounded-xl text-xs resize-none" placeholder="Describe la producción..."></textarea>
                        </div>
                    </div>

                    <!-- El Creador de Capítulos de Series -->
                    <div class="bg-white/[0.02] border border-white/5 p-6 rounded-2xl">
                        <div class="flex justify-between items-center mb-4 border-b border-white/5 pb-4">
                            <div>
                                <h4 class="text-sm font-black uppercase text-white tracking-widest">Episodios / Capítulos</h4>
                                <p class="text-[8px] font-bold text-gray-500 uppercase tracking-widest mt-1">Añade links de YouTube por orden</p>
                            </div>
                            <button type="button" onclick="addChapterRow()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-lg text-[9px] font-black uppercase tracking-widest transition border border-white/10 shadow-sm">
                                + Añadir Capítulo
                            </button>
                        </div>
                        <div id="chapters-container" class="space-y-4"></div>
                    </div>

                </form>
            </div>
        </div>

    </div>

    <!-- MODAL DE CINE (PREVISUALIZADOR) -->
    <div id="video-preview-modal" class="fixed inset-0 z-[9999] hidden items-center justify-center bg-black/90 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-300">
        <div id="video-preview-box" class="relative w-full max-w-5xl aspect-video bg-black rounded-2xl overflow-hidden shadow-[0_0_50px_rgba(239,68,68,0.2)] transform scale-95 transition-transform duration-300 border border-white/10">
            <!-- Botón de Cerrar Modal -->
            <button type="button" onclick="closeVideoPreview()" class="absolute top-4 right-4 z-50 w-10 h-10 bg-red-500 text-white rounded-full flex items-center justify-center hover:scale-110 transition-transform shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <iframe id="modal-iframe" class="w-full h-full border-0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <script src="/static/js/admin/admin_middleware.js?v=4.0"></script>
    <script src="/static/js/admin/on.js?v=5.0"></script>
</body>
</html>
