<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ ADMIN | Consola ON (Streaming)</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(220, 38, 38, 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        .chapter-card { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-[#030305] text-white selection:bg-red-600 selection:text-white min-h-screen flex flex-col font-sans overflow-x-hidden">

    <div id="admin-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none border border-white/10"></div>

    <header class="w-full border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black uppercase tracking-tighter">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                    <span class="text-red-500 text-xs font-mono tracking-widest ml-2">CORE_ON</span>
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <a href="/apps/admin/dashboard.html" class="px-5 py-2 rounded-full border border-white/10 text-gray-400 hover:text-white font-bold text-[10px] uppercase tracking-widest transition">Dashboard</a>
            </div>
        </div>
    </header>

    <div id="admin-spinner" class="flex-grow flex flex-col items-center justify-center py-20">
        <div class="w-8 h-8 border-2 border-white/10 border-t-red-600 rounded-full animate-spin mb-3"></div>
        <p class="text-gray-600 text-[9px] font-black uppercase tracking-widest">Sincronizando Bóveda Cinematográfica...</p>
    </div>

    <main id="admin-panel-content" class="hidden max-w-7xl mx-auto w-full px-6 py-10 flex-grow flex flex-col">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-white/5 pb-6">
            <div>
                <p class="text-red-500 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Director de Contenidos</p>
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Catálogo Streaming</h2>
            </div>
            <button onclick="openFilmModal()" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-red-600 hover:bg-red-500 text-white text-[10px] font-black uppercase tracking-widest transition shadow-[0_0_20px_rgba(220,38,38,0.3)] transform hover:scale-105">
                + Inyectar Producción
            </button>
        </div>

        <div class="mb-6">
            <input type="text" id="admin-film-search" oninput="triggerFilmSearch()" placeholder="Buscar por título, categoría o clasificación..." class="w-full glass-input px-5 py-4 rounded-xl text-xs font-medium">
        </div>

        <div id="films-grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 auto-rows-auto"></div>
    </main>

    <div id="film-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[999] flex items-center justify-center p-4 opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel w-full max-w-4xl max-h-[90vh] overflow-y-auto custom-scrollbar rounded-[32px] border border-red-500/20 bg-[#07070a] p-6 md:p-8 space-y-6 shadow-[0_0_50px_rgba(220,38,38,0.1)]">
            <div class="flex justify-between items-center border-b border-white/5 pb-4 sticky top-0 bg-[#07070a] z-20">
                <div>
                    <h3 id="modal-film-title" class="text-xl font-black uppercase tracking-tighter text-white">Nueva Producción</h3>
                    <p class="text-[9px] text-gray-500 font-bold tracking-widest uppercase mt-1">Base de Datos: on_films</p>
                </div>
                <button onclick="closeFilmModal()" class="text-gray-500 hover:text-white text-xs uppercase tracking-widest font-black transition">Cerrar</button>
            </div>

            <form id="film-form" onsubmit="handleFilmSubmit(event)" class="space-y-6 text-xs">
                <input type="hidden" id="form-film-id">
                <div class="space-y-4">
                    <h4 class="text-[10px] font-black uppercase text-red-500 tracking-widest border-b border-white/5 pb-2">1. Detalles Generales</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">Título de la Producción *</label>
                            <input type="text" id="form-title" required class="w-full glass-input p-3.5 rounded-xl font-bold text-white">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">Categoría *</label>
                            <select id="form-category" required class="w-full glass-input p-3.5 rounded-xl bg-[#09090e] font-bold">
                                <option value="Serie">Serie</option>
                                <option value="Película">Película</option>
                                <option value="Documental">Documental</option>
                                <option value="Corto">Corto</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div>
                            <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">Año *</label>
                            <input type="number" id="form-year" required value="2026" class="w-full glass-input p-3.5 rounded-xl font-mono text-center">
                        </div>
                        <div>
                            <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">Edad *</label>
                            <select id="form-age" required class="w-full glass-input p-3.5 rounded-xl bg-[#09090e] text-center font-bold">
                                <option value="TP">Todo Público</option>
                                <option value="12+">12+</option>
                                <option value="16+">16+</option>
                                <option value="18+">18+</option>
                            </select>
                        </div>
                        <div class="col-span-2">
                            <label class="block text-[#FFC300] font-bold uppercase tracking-wider mb-1">Nivel de Acceso (Paywall) *</label>
                            <select id="form-tier" required class="w-full glass-input border-[#FFC300]/30 p-3.5 rounded-xl bg-[#09090e] text-[#FFC300] font-black uppercase tracking-widest text-center">
                                <option value="BASICO">BÁSICO (Visible para todos)</option>
                                <option value="PLUS">PLUS (Plus y Ultra)</option>
                                <option value="ULTRA">ULTRA (Solo Ultra)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">URL de Portada (Thumbnail) *</label>
                        <input type="url" id="form-cover" required placeholder="https://images.unsplash.com/..." class="w-full glass-input p-3.5 rounded-xl text-sky-400 font-mono text-[10px]">
                    </div>
                    <div>
                        <label class="block text-gray-500 font-bold uppercase tracking-wider mb-1">Sinopsis *</label>
                        <textarea id="form-synopsis" required rows="3" class="w-full glass-input p-3.5 rounded-xl resize-none leading-relaxed" placeholder="Describe brevemente de qué trata esta producción..."></textarea>
                    </div>
                </div>

                <div class="space-y-4 pt-4 border-t border-white/5">
                    <div class="flex justify-between items-center border-b border-white/5 pb-2">
                        <div>
                            <h4 class="text-[10px] font-black uppercase text-red-500 tracking-widest">2. Contenido Audiovisual (Capítulos)</h4>
                            <p class="text-[8px] text-gray-500 font-bold tracking-widest mt-1">Si es película o corto, solo agrega 1 capítulo.</p>
                        </div>
                        <button type="button" onclick="addChapterRow()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-white rounded-lg text-[9px] font-black uppercase tracking-widest transition shadow-md border border-white/10">
                            + Añadir Capítulo
                        </button>
                    </div>
                    <div id="chapters-container" class="space-y-4 max-h-[400px] overflow-y-auto custom-scrollbar pr-2"></div>
                </div>

                <div class="pt-6 border-t border-white/5 flex justify-end gap-3 sticky bottom-0 bg-[#07070a] py-4 z-20">
                    <button type="button" onclick="closeFilmModal()" class="px-6 py-3 rounded-xl bg-white/5 text-gray-400 hover:text-white font-black uppercase tracking-widest transition">Cancelar</button>
                    <button type="submit" id="btn-submit-film" class="px-8 py-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-black uppercase tracking-[0.15em] transition shadow-[0_0_20px_rgba(220,38,38,0.3)]">Guardar Producción</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/js/admin/admin_middleware.js"></script>
    <script src="/static/js/admin/on.js"></script>
</body>
</html>
