<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez OS | Pulse Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: white; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        
        .glass-input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); outline: none; }
        
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-bubble { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="h-screen w-full flex selection:bg-sky-500 selection:text-white">

    <div id="message-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center border backdrop-blur-md"></div>

    <div id="inventory-panel" class="w-full md:w-[35%] lg:w-[30%] h-full border-r border-white/10 bg-[#0a0a0f]/80 backdrop-blur-xl flex flex-col shrink-0 transition-transform duration-300 relative z-30">
        <div class="p-4 md:p-6 border-b border-white/5 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black uppercase tracking-tighter text-white">Pulse <span class="text-sky-500">Center</span></h2>
                <div id="pulse-indicator" class="w-3 h-3 rounded-full bg-sky-500 animate-pulse shadow-[0_0_10px_rgba(56,189,248,0.8)]"></div>
            </div>
            
            <div class="relative mb-3">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="admin-chat-search" placeholder="Buscar atleta..." class="w-full glass-input pl-9 pr-4 py-2.5 rounded-xl text-xs focus:border-sky-500">
            </div>

            <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button onclick="filterChats('espera')" id="tab-espera" class="cat-filter flex-1 py-1.5 rounded-lg border border-amber-500/30 bg-amber-500/10 text-amber-500 text-[8px] font-black uppercase tracking-widest transition-all text-center shrink-0">En Espera</button>
                <button onclick="filterChats('activo')" id="tab-activo" class="cat-filter flex-1 py-1.5 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest transition-all text-center shrink-0">Activos</button>
                <button onclick="filterChats('directorio')" id="tab-directorio" class="cat-filter flex-1 py-1.5 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest transition-all text-center shrink-0">Directorio</button>
            </div>
        </div>

        <div id="chats-list-container" class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </div>

    <div class="hidden md:flex flex-1 h-full bg-[#050505] flex-col relative z-20" id="workspace-panel">
        
        <div id="ws-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10 fade-in">
            <div class="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-sky-500/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h3 class="text-xl font-black uppercase tracking-tighter text-white">Módulo de Asistencia</h3>
            <p class="text-xs text-gray-500 font-medium mt-2 max-w-sm">Selecciona una sala en espera o busca un atleta en el directorio para intervenir.</p>
        </div>

        <div id="ws-chat" class="hidden flex-col h-full z-20 fade-in w-full bg-[#050505]">
            <div class="px-6 py-5 border-b border-white/5 bg-gradient-to-r from-sky-900/10 to-transparent shrink-0 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <button onclick="closeMobileWorkspace()" class="md:hidden w-8 h-8 rounded-full bg-white/5 flex items-center justify-center text-white border border-white/10 shrink-0 hover:bg-white/10 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <div class="min-w-0">
                        <h2 id="current-chat-name" class="text-xl font-black uppercase tracking-tighter text-white leading-none truncate">--</h2>
                        <p id="current-chat-status" class="text-emerald-400 text-[9px] font-bold uppercase tracking-widest flex items-center gap-1.5 mt-1"></p>
                    </div>
                </div>
                <div class="flex gap-2 shrink-0">
                    <button onclick="markAsActive()" id="btn-accept-chat" class="hidden px-4 py-2 rounded-xl bg-emerald-500 text-black hover:bg-emerald-400 text-[9px] font-black uppercase tracking-widest transition-colors shadow-[0_0_15px_rgba(16,185,129,0.2)]">Intervenir</button>
                    <button onclick="closeCurrentSession()" id="btn-close-chat" class="px-4 py-2 rounded-xl border border-red-500/20 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white text-[9px] font-black uppercase tracking-widest transition-colors">Cerrar Ticket</button>
                </div>
            </div>

            <div id="messages-area" class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar space-y-4 relative">
                <div class="absolute inset-0 opacity-[0.02] pointer-events-none" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>
                </div>

            <div class="p-4 md:p-6 shrink-0 bg-gradient-to-t from-[#020203] to-transparent border-t border-white/5">
                <form id="admin-chat-form" class="flex gap-3 items-end w-full relative max-w-4xl mx-auto">
                    <textarea id="admin-chat-input" rows="1" class="w-full glass-input px-4 py-3.5 pr-14 rounded-2xl text-sm outline-none resize-none focus:border-sky-500 custom-scrollbar leading-snug" placeholder="Pulse Message..." required disabled></textarea>
                    <button type="submit" id="admin-send-btn" class="absolute right-2 bottom-2 w-10 h-10 shrink-0 bg-sky-500 text-white rounded-xl flex items-center justify-center hover:bg-sky-400 transition-transform active:scale-95 disabled:opacity-50 shadow-[0_0_15px_rgba(56,189,248,0.3)]" disabled>
                        <svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <script src="/static/js/admin/admin_middleware.js?v=6.0"></script>
    <script type="module" src="/static/js/admin/pulse.js?v=7.0"></script>
</body>
</html>
