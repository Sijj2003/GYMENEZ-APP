<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ CORE | Pulse Center</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        body { background-color: #030305; color: #fff; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #38bdf8; }
        
        .chat-list-item { transition: all 0.2s ease; }
        .chat-list-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid #38bdf8; }
    </style>
</head>
<body class="selection:bg-sky-500 selection:text-white h-screen flex flex-col font-sans">

    <header class="w-full border-b border-white/5 bg-black/40 backdrop-blur-md shrink-0 z-50">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black uppercase tracking-tighter">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                    <span class="text-sky-500 text-xs font-mono tracking-widest ml-2">CORE_PULSE</span>
                </h1>
            </div>
            <a href="/apps/admin/dashboard.html" class="px-5 py-2 rounded-full border border-white/10 text-gray-400 hover:text-white font-bold text-[10px] uppercase tracking-widest transition">Dashboard</a>
        </div>
    </header>

    <main class="flex-grow flex w-full h-[calc(100vh-65px)] overflow-hidden relative">
        
        <div id="pulse-loader" class="absolute inset-0 bg-[#030305] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-8 h-8 border-2 border-white/10 border-t-sky-500 rounded-full animate-spin mb-3"></div>
            <p class="text-gray-600 text-[9px] font-black uppercase tracking-widest">Conectando Radares en Tiempo Real...</p>
        </div>

        <div class="w-1/3 max-w-[350px] border-r border-white/5 bg-[#060608] flex flex-col shrink-0">
            <div class="p-4 border-b border-white/5 bg-white/[0.01]">
                <h2 class="text-xs font-black uppercase tracking-widest text-sky-400 mb-3">Bandeja de Entrada</h2>
                <div class="flex gap-2">
                    <button onclick="filterChats('espera')" class="flex-1 py-1.5 bg-amber-500/10 text-amber-500 rounded text-[9px] font-bold uppercase border border-amber-500/20">En Espera</button>
                    <button onclick="filterChats('activo')" class="flex-1 py-1.5 bg-emerald-500/10 text-emerald-500 rounded text-[9px] font-bold uppercase border border-emerald-500/20">Activos</button>
                </div>
            </div>
            
            <div id="chats-list-container" class="flex-grow overflow-y-auto custom-scrollbar">
                </div>
        </div>

        <div class="flex-grow bg-[url('/static/img/backgrounds/FONDO.png')] bg-cover bg-center bg-blend-overlay flex flex-col relative">
            <div class="absolute inset-0 bg-black/80 z-0"></div>

            <div id="empty-chat-state" class="absolute inset-0 z-10 flex flex-col items-center justify-center">
                <div class="w-16 h-16 rounded-full bg-sky-500/10 flex items-center justify-center border border-sky-500/20 mb-4 shadow-[0_0_20px_rgba(14,165,233,0.15)]">
                    <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h3 class="text-white font-black uppercase tracking-widest text-lg">GYMENEZ PULSE</h3>
                <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold mt-2">Selecciona un atleta para abrir transmisión</p>
            </div>

            <div id="active-chat-container" class="hidden flex-col h-full z-10">
                
                <div class="px-6 py-4 border-b border-white/5 bg-black/60 backdrop-blur flex justify-between items-center shrink-0">
                    <div>
                        <h3 id="current-chat-name" class="text-white font-black uppercase tracking-tighter text-lg">Nombre Atleta</h3>
                        <p id="current-chat-status" class="text-emerald-400 text-[9px] font-bold uppercase tracking-widest flex items-center gap-1.5 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Sesión Activa
                        </p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="markAsActive()" id="btn-accept-chat" class="hidden px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-[9px] font-black uppercase tracking-widest transition shadow-lg">Aceptar Solicitud</button>
                        <button onclick="closeCurrentSession()" class="px-4 py-2 bg-red-500/10 border border-red-500/20 text-red-500 hover:bg-red-500 hover:text-white rounded-lg text-[9px] font-black uppercase tracking-widest transition">Cerrar Sesión</button>
                    </div>
                </div>

                <div id="messages-area" class="flex-grow overflow-y-auto custom-scrollbar p-6 space-y-4">
                    </div>

                <div class="p-4 bg-black/80 backdrop-blur border-t border-white/5 shrink-0">
                    <form id="admin-chat-form" class="flex gap-3 items-end">
                        <textarea id="admin-chat-input" rows="1" class="w-full bg-white/5 border border-white/10 text-white text-sm p-3.5 rounded-xl focus:border-sky-500 focus:bg-black/60 outline-none resize-none custom-scrollbar transition-all" placeholder="Escribe al atleta..." required disabled></textarea>
                        
                        <button type="submit" id="admin-send-btn" class="w-12 h-12 shrink-0 bg-sky-500 text-white rounded-xl flex items-center justify-center hover:bg-sky-400 transition-colors shadow-[0_0_15px_rgba(56,189,248,0.3)] transform hover:scale-105 disabled:opacity-50" disabled>
                            <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <script type="module" src="/static/js/admin/pulse.js"></script>
</body>
</html>
