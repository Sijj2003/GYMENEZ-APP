<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ CORE | Pulse Center</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        body { background-color: #030305; color: #fff; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }
        .chat-list-item { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
        .chat-list-item.active { background: rgba(56, 189, 248, 0.05); border-left: 3px solid #38bdf8; }
        .message-bubble { animation: popIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95) translateY(10px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
    </style>
</head>
<body class="selection:bg-sky-500 selection:text-white h-screen flex flex-col font-sans">

    <header class="w-full border-b border-white/5 bg-[#0a0a0f]/80 backdrop-blur-xl shrink-0 z-50">
        <div class="px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black uppercase tracking-tighter">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                    <span class="text-sky-500 text-xs font-mono tracking-widest ml-2">CORE_PULSE</span>
                </h1>
            </div>
            <a href="/apps/admin/dashboard.html" class="px-5 py-2 rounded-full bg-white/5 border border-white/10 text-gray-300 hover:bg-white hover:text-black font-bold text-[10px] uppercase tracking-widest transition-all">Panel Central</a>
        </div>
    </header>

    <main class="flex-grow flex w-full h-[calc(100vh-65px)] overflow-hidden relative">
        
        <div id="pulse-loader" class="absolute inset-0 bg-[#030305] z-50 flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-8 h-8 border-2 border-white/10 border-t-sky-500 rounded-full animate-spin mb-3"></div>
            <p class="text-gray-600 text-[9px] font-black uppercase tracking-widest">Sincronizando Radares...</p>
        </div>

        <div class="w-1/3 max-w-[350px] border-r border-white/5 bg-[#060608] flex flex-col shrink-0">
            <div class="p-5 border-b border-white/5 bg-white/[0.01]">
                <h2 class="text-xs font-black uppercase tracking-widest text-sky-400 mb-4">Bandeja Operativa</h2>
                
                <div class="mb-4 relative">
                    <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="admin-chat-search" placeholder="Buscar en toda la base..." class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-9 pr-4 text-xs text-white focus:border-sky-500 outline-none transition-colors">
                </div>

                <div class="flex gap-1 bg-black/40 p-1 rounded-lg border border-white/5">
                    <button onclick="filterChats('espera')" id="tab-espera" class="flex-1 py-1.5 bg-amber-500/10 text-amber-500 rounded text-[9px] font-bold uppercase transition-all">En Espera</button>
                    <button onclick="filterChats('activo')" id="tab-activo" class="flex-1 py-1.5 text-gray-500 hover:text-white rounded text-[9px] font-bold uppercase transition-all">Activos</button>
                    <button onclick="filterChats('directorio')" id="tab-directorio" class="flex-1 py-1.5 text-gray-500 hover:text-white rounded text-[9px] font-bold uppercase transition-all">Directorio</button>
                </div>
            </div>
            
            <div id="chats-list-container" class="flex-grow overflow-y-auto custom-scrollbar p-2 space-y-1"></div>
        </div>

        <div class="flex-grow bg-[#0a0a0f] flex flex-col relative">
            <div class="absolute inset-0 opacity-[0.03] pointer-events-none" style="background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 20px 20px;"></div>

            <div id="empty-chat-state" class="absolute inset-0 z-10 flex flex-col items-center justify-center">
                <div class="w-16 h-16 rounded-full bg-sky-500/5 flex items-center justify-center border border-sky-500/10 mb-4">
                    <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                </div>
                <h3 class="text-white font-black uppercase tracking-widest text-lg">Módulo de Asistencia</h3>
                <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold mt-2">Selecciona o busca un atleta en el Directorio</p>
            </div>

            <div id="active-chat-container" class="hidden flex-col h-full z-10">
                <div class="px-8 py-5 border-b border-white/5 bg-white/[0.02] backdrop-blur-xl flex justify-between items-center shrink-0">
                    <div>
                        <h3 id="current-chat-name" class="text-white font-black uppercase tracking-tighter text-xl">--</h3>
                        <p id="current-chat-status" class="text-emerald-400 text-[10px] font-bold uppercase tracking-widest flex items-center gap-1.5 mt-1"></p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="markAsActive()" id="btn-accept-chat" class="hidden px-5 py-2.5 bg-emerald-500 text-black hover:bg-emerald-400 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all transform hover:scale-105">Intervenir Sala</button>
                        <button onclick="closeCurrentSession()" class="px-5 py-2.5 bg-white/5 border border-white/10 text-gray-400 hover:bg-red-500 hover:border-red-500 hover:text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">Cerrar Ticket</button>
                    </div>
                </div>

                <div id="messages-area" class="flex-grow overflow-y-auto custom-scrollbar px-8 py-6 space-y-6"></div>

                <div class="p-6 shrink-0 bg-gradient-to-t from-[#0a0a0f] to-transparent">
                    <form id="admin-chat-form" class="flex gap-3 items-end max-w-4xl mx-auto bg-white/5 border border-white/10 p-2 rounded-[24px] backdrop-blur-xl focus-within:border-sky-500/50 transition-colors">
                        <textarea id="admin-chat-input" rows="1" class="w-full bg-transparent text-white text-sm px-4 py-3 outline-none resize-none custom-scrollbar" placeholder="Pulse Message..." required disabled></textarea>
                        <button type="submit" id="admin-send-btn" class="w-10 h-10 shrink-0 bg-sky-500 text-white rounded-[16px] flex items-center justify-center hover:bg-sky-400 transition-colors disabled:opacity-50" disabled>
                            <svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="/static/js/admin/admin_middleware.js"></script>
    <script type="module" src="/static/js/admin/pulse.js"></script>
</body>
</html>
