<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GYMENEZ | System Core Access</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030305; 
            -webkit-font-smoothing: antialiased;
        }

        /* 🚀 FONDOS Y BRILLOS */
        .bg-mesh {
            background-image: 
                radial-gradient(at 50% 0%, rgba(255, 195, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 50%);
        }

        /* 💎 GLASSMORPHISM PREMIUM */
        .glass-panel {
            background: linear-gradient(145deg, rgba(20, 20, 25, 0.6) 0%, rgba(10, 10, 15, 0.8) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* 🎛️ INPUTS MODERNOS */
        .glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-input:focus {
            border-color: #FFC300;
            background: rgba(0, 0, 0, 0.8);
            box-shadow: 0 0 0 4px rgba(255, 195, 0, 0.1);
            outline: none;
        }
        .glass-input::placeholder { color: rgba(255, 255, 255, 0.2); }

        /* ✨ ANIMACIONES FLUIDAS */
        .fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-enter { animation: modalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black min-h-screen flex flex-col justify-center overflow-hidden bg-mesh relative">

    <!-- FEEDBACK TOAST -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center w-max max-w-[90vw] border border-white/10 backdrop-blur-md"></div>

    <!-- MAIN CONTAINER -->
    <main class="relative z-10 w-full flex items-center justify-center p-4 sm:p-6 fade-in-up">
        
        <div class="glass-panel p-8 sm:p-12 w-full max-w-[420px] rounded-[2rem] relative overflow-hidden">
            
            <!-- Resplandor superior sutil -->
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-[#FFC300]/50 to-transparent"></div>

            <!-- HEADER -->
            <div class="text-center mb-10">
                <div class="w-14 h-14 mx-auto bg-[#FFC300]/10 rounded-2xl flex items-center justify-center border border-[#FFC300]/20 mb-5 shadow-[0_0_20px_rgba(255,195,0,0.15)] relative">
                    <!-- Icono Escudo/Core -->
                    <svg class="w-6 h-6 text-[#FFC300]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01"></path></svg>
                    <!-- Punto de pulso -->
                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-[#FFC300] rounded-full animate-pulse border-2 border-[#0a0a0f]"></span>
                </div>
                <h1 class="text-2xl font-[900] text-white tracking-tighter uppercase mb-1.5">System Core</h1>
                <p class="text-gray-500 text-[9px] font-black uppercase tracking-[0.3em]">Acceso Restringido</p>
            </div>

            <!-- FORMULARIO -->
            <form id="admin-login-form" class="space-y-5">
                
                <!-- Email Input -->
                <div class="space-y-1.5">
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest ml-1">Terminal ID</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <input type="email" id="login-email" class="w-full glass-input pl-11 pr-4 py-3.5 rounded-xl text-sm font-medium" placeholder="admin@gymenez.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-1.5">
                    <label class="block text-[9px] font-bold text-gray-400 uppercase tracking-widest ml-1">Llave de Seguridad</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="login-password" class="w-full glass-input pl-11 pr-4 py-3.5 rounded-xl text-sm font-mono tracking-widest" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-4">
                    <button type="submit" id="login-btn" class="w-full py-4 rounded-xl bg-white text-black font-[900] text-[10px] uppercase tracking-[0.2em] hover:bg-[#FFC300] transition-colors shadow-lg hover:shadow-[0_0_20px_rgba(255,195,0,0.3)] flex justify-center items-center gap-2">
                        Verificar Credenciales
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
            
            <!-- FOOTER LINKS -->
            <div class="mt-8 pt-6 border-t border-white/5 text-center flex flex-col items-center gap-4">
                <a href="/apps/start/login.html" class="text-[9px] font-bold text-gray-500 hover:text-white transition-colors uppercase tracking-[0.15em] flex items-center gap-1.5">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Volver al Frontend
                </a>
            </div>
        </div>
    </main>

    <!-- 🛡️ 2FA MODAL (DISEÑO BIOMÉTRICO) -->
    <div id="2fa-modal" class="hidden fixed inset-0 bg-[#030305]/95 backdrop-blur-xl z-[9999] items-center justify-center p-4">
        
        <div class="glass-panel p-8 sm:p-10 rounded-[2rem] text-center w-full max-w-sm relative opacity-0 transform scale-95" id="2fa-content">
            
            <!-- Botón Cerrar -->
            <button id="btn-close-2fa" type="button" class="absolute top-5 right-5 w-8 h-8 flex items-center justify-center rounded-full bg-white/5 text-gray-400 hover:bg-red-500/20 hover:text-red-400 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Icono Candado -->
            <div class="w-12 h-12 mx-auto rounded-full bg-white/5 flex items-center justify-center border border-white/10 mb-4">
                <svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
            </div>

            <h3 class="text-white font-[900] uppercase tracking-widest text-lg mb-1">Verificación 2FA</h3>
            <p class="text-[9px] text-gray-500 font-bold uppercase tracking-widest mb-6">Confirme su identidad</p>
            
            <input type="text" id="otp-input" maxlength="6" inputmode="numeric" class="w-full text-center text-3xl font-mono p-4 rounded-xl glass-input text-white mb-6 tracking-[0.5em]" placeholder="------">
            
            <button id="btn-verify-2fa" class="w-full py-4 rounded-xl bg-[#FFC300] text-black font-[900] text-[10px] uppercase tracking-[0.2em] hover:bg-yellow-400 transition-colors shadow-[0_0_15px_rgba(255,195,0,0.2)]">
                Desbloquear Core
            </button>
        </div>
    </div>

    <!-- SCRIPT INYECTADO PARA ANIMAR EL MODAL 2FA SIN CAMBIAR TU JS PRINCIPAL -->
    <script>
        // Observador para inyectar animación al modal cuando tu JS original le quite la clase 'hidden'
        const modalObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === "class") {
                    const modal = document.getElementById('2fa-modal');
                    const content = document.getElementById('2fa-content');
                    if (!modal.classList.contains('hidden')) {
                        content.classList.add('modal-enter');
                    } else {
                        content.classList.remove('modal-enter');
                    }
                }
            });
        });
        modalObserver.observe(document.getElementById('2fa-modal'), { attributes: true });
    </script>

    <!-- TU SCRIPT LÓGICO ORIGINAL INTACTO -->
    <script src="/static/js/admin/login.js"></script>
</body>
</html>
