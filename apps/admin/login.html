<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gymenez Performance | Portal Administrativo</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/logos/mini_logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030305; 
            -webkit-font-smoothing: antialiased;
        }

        /* 🏢 FONDO CORPORATIVO ELEGANTE */
        .executive-bg {
            background-color: #050508;
            background-image: radial-gradient(at 100% 0%, rgba(255, 195, 0, 0.04) 0px, transparent 40%),
                              radial-gradient(at 0% 100%, rgba(255, 255, 255, 0.02) 0px, transparent 40%);
        }

        /* 📋 PANEL MINIMALISTA */
        .executive-panel {
            background: #0A0A0F;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 🎛️ INPUTS PROFESIONALES */
        .executive-input {
            background: #12121A;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 0.75rem;
            transition: all 0.2s ease-in-out;
        }
        .executive-input:focus {
            border-color: #FFC300;
            background: #181822;
            box-shadow: 0 0 0 3px rgba(255, 195, 0, 0.1);
            outline: none;
        }
        .executive-input::placeholder { color: #6B7280; font-weight: 400; }

        /* ✨ ANIMACIÓN SUAVE DE ENTRADA */
        .fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(10px);
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black min-h-screen flex flex-col justify-center overflow-hidden executive-bg">

    <!-- FEEDBACK DE ESTADO (TOAST) -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl text-xs font-bold shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center w-max max-w-[90vw] border"></div>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="relative z-10 w-full flex items-center justify-center p-4 sm:p-6 fade-in">
        
        <div class="executive-panel p-8 sm:p-10 w-full max-w-[400px]">
            
            <!-- BRANDING EJECUTIVO -->
            <div class="text-center mb-8">
                <!-- Logotipo -->
                <div class="flex justify-center items-center mb-5">
                    <!-- Si no encuentra el SVG, pone la G dorada como respaldo -->
                    <img src="/static/img/logos/mini_logo.svg" alt="Gymenez Logo" class="w-12 h-12 object-contain" onerror="this.outerHTML='<span class=\'text-4xl font-[900] italic text-[#FFC300]\'>G</span>'">
                </div>
                
                <h1 class="text-2xl font-[900] text-white tracking-tight uppercase leading-none mb-2">
                    <span class="text-[#FFC300] italic">GYM</span>ENEZ
                </h1>
                <h2 class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
                    Portal Administrativo
                </h2>
            </div>

            <!-- FORMULARIO -->
            <form id="admin-login-form" class="space-y-5">
                
                <!-- Email -->
                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1.5 ml-1">Correo Corporativo</label>
                    <input type="email" id="login-email" class="w-full executive-input px-4 py-3.5 text-sm" placeholder="administracion@gymenez.com" required autocomplete="email">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-[11px] font-semibold text-gray-400 mb-1.5 ml-1">Clave de Acceso</label>
                    <input type="password" id="login-password" class="w-full executive-input px-4 py-3.5 text-sm font-mono tracking-wider" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <!-- Submit -->
                <div class="pt-4">
                    <button type="submit" id="login-btn" class="w-full py-3.5 rounded-xl bg-[#FFC300] text-black font-[900] text-xs uppercase tracking-wider hover:bg-yellow-400 transition-colors shadow-sm">
                        Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <!-- FOOTER -->
            <div class="mt-8 text-center border-t border-white/5 pt-6">
                <a href="/apps/start/login.html" class="text-[11px] font-medium text-gray-500 hover:text-white transition-colors flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Retornar a Plataforma
                </a>
            </div>
        </div>
    </main>

    <!-- 🛡️ 2FA MODAL (CENTRADOS Y FUNCIONALES) -->
    <!-- El flex aquí es CLAVE para que se centre perfectamente -->
    <div id="2fa-modal" class="hidden fixed inset-0 bg-[#030305]/80 backdrop-blur-sm z-[9999] items-center justify-center p-4">
        
        <div class="executive-panel p-8 sm:p-10 text-center w-full max-w-sm relative" id="2fa-content">
            
            <!-- Botón Cerrar -->
            <button id="btn-close-2fa" type="button" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full text-gray-500 hover:bg-white/5 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- Icono de Seguridad -->
            <div class="w-12 h-12 mx-auto rounded-full bg-white/5 flex items-center justify-center border border-white/10 mb-5">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>

            <h3 class="text-white font-[900] uppercase tracking-wide text-lg mb-1">Doble Autenticación</h3>
            <p class="text-xs text-gray-400 font-medium mb-6">Ingrese su código de seguridad (TOTP)</p>
            
            <input type="text" id="otp-input" maxlength="6" inputmode="numeric" class="w-full text-center text-2xl font-mono p-4 rounded-xl executive-input text-white mb-6 tracking-[0.5em]" placeholder="------">
            
            <button id="btn-verify-2fa" class="w-full py-3.5 rounded-xl bg-white text-black font-[900] text-xs uppercase tracking-wider hover:bg-gray-200 transition-colors shadow-sm">
                Confirmar Identidad
            </button>
        </div>
    </div>

    <!-- Script para asegurar que el modal usa FLEX al mostrarse, resolviendo el problema de la esquina -->
    <script>
        const modalObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.attributeName === "class") {
                    const modal = document.getElementById('2fa-modal');
                    // Si el JS le quita el 'hidden', debemos asegurar que se comporte como 'flex'
                    if (!modal.classList.contains('hidden')) {
                        modal.style.display = 'flex';
                    } else {
                        modal.style.display = '';
                    }
                }
            });
        });
        modalObserver.observe(document.getElementById('2fa-modal'), { attributes: true });
    </script>

    <!-- Enlace a tu lógica intacta -->
    <script src="/static/js/admin/login.js"></script>
</body>
</html>
