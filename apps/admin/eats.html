<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez OS | Bóveda Eats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: white; margin: 0; overflow: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        
        .glass-input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); color: white; transition: all 0.3s ease; }
        .glass-input:focus { border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.1); outline: none; }
        
        .fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen w-full flex selection:bg-[#10b981] selection:text-black">

    <div id="message-box" class="fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center border backdrop-blur-md"></div>

    <!-- COLUMNA IZQUIERDA: INVENTARIO DE ALIMENTOS -->
    <div class="w-full md:w-[35%] lg:w-[30%] h-full border-r border-white/10 bg-[#0a0a0f]/80 backdrop-blur-xl flex flex-col shrink-0">
        <div class="p-4 md:p-6 border-b border-white/5 shrink-0">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-black uppercase tracking-tighter text-white">Bóveda Eats</h2>
                <button onclick="openCreateWorkspace()" class="w-8 h-8 rounded-full bg-emerald-500 text-black flex items-center justify-center hover:scale-105 transition-transform shadow-[0_0_15px_rgba(16,185,129,0.3)]">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            
            <div class="relative mb-3">
                <svg class="w-4 h-4 text-gray-500 absolute left-3 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-inventory" placeholder="Buscar alimento o macro..." class="w-full glass-input pl-9 pr-4 py-2.5 rounded-xl text-xs">
            </div>

            <!-- Filtros Rápidos (Chips) -->
            <div class="flex gap-2 overflow-x-auto custom-scrollbar pb-2">
                <button onclick="filterCategory('')" class="cat-filter px-3 py-1 rounded-lg border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Todos</button>
                <button onclick="filterCategory('Proteína')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Proteínas</button>
                <button onclick="filterCategory('Carbohidrato')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Carbohidratos</button>
                <button onclick="filterCategory('Grasa')" class="cat-filter px-3 py-1 rounded-lg border border-white/10 text-gray-400 hover:text-white text-[8px] font-black uppercase tracking-widest shrink-0 transition-all">Grasas</button>
            </div>
        </div>

        <div id="inventory-list" class="flex-1 overflow-y-auto p-3 space-y-1">
            <div class="flex justify-center py-10"><div class="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div></div>
        </div>
    </div>

    <!-- COLUMNA DERECHA: LIENZO DE INGENIERÍA NUTRICIONAL -->
    <div class="hidden md:flex flex-1 h-full bg-[#050505] flex-col relative" id="workspace-panel">
        
        <!-- Estado Vacío -->
        <div id="ws-empty" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10 fade-in">
            <div class="w-16 h-16 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mb-4 text-emerald-500/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
            <h3 class="text-xl font-black uppercase tracking-tighter text-white">Laboratorio Bioquímico</h3>
            <p class="text-xs text-gray-500 font-medium mt-2 max-w-sm">Selecciona un elemento de la bóveda para calibrar sus macros y calorías.</p>
        </div>

        <!-- Dossier del Alimento -->
        <div id="ws-food" class="hidden flex-col h-full z-20 fade-in w-full">
            <div class="px-8 py-6 border-b border-white/5 bg-gradient-to-r from-emerald-900/10 to-transparent shrink-0 flex justify-between items-start">
                <div>
                    <span id="e-cat-badge" class="px-2 py-0.5 rounded text-[8px] font-black uppercase tracking-widest bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mb-2 inline-block">Categoría</span>
                    <h2 id="e-header-title" class="text-2xl font-black uppercase tracking-tighter text-white">Nuevo Alimento</h2>
                </div>
                <div class="flex gap-2">
                    <button id="e-btn-delete" onclick="deleteCurrentFood()" class="hidden px-4 py-2 rounded-xl border border-red-500/20 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white text-[9px] font-black uppercase tracking-widest transition-colors">Purgar</button>
                    <button onclick="saveFood()" id="e-btn-save" class="px-6 py-2 rounded-xl bg-emerald-500 text-black hover:scale-105 text-[9px] font-black uppercase tracking-widest transition-transform shadow-[0_0_15px_rgba(16,185,129,0.2)]">Sintetizar Macro</button>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
                <form id="food-form" class="max-w-4xl space-y-6 mx-auto">
                    <input type="hidden" id="e-id">
                    <input type="hidden" id="e-is-edit" value="false">

                    <!-- IDENTIDAD DEL ALIMENTO -->
                    <div class="bg-white/[0.02] border border-white/5 p-6 rounded-2xl">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Nomenclatura (Nombre)</label>
                                <input type="text" id="e-name" required class="w-full glass-input p-3 rounded-xl text-sm font-black uppercase text-white" placeholder="Ej: Pechuga de Pollo">
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Clasificación</label>
                                    <select id="e-category" class="w-full glass-input p-3 rounded-xl text-xs font-bold uppercase bg-[#0a0a0f] text-emerald-400">
                                        <option value="Proteína">Proteína</option>
                                        <option value="Carbohidrato">Carbohidrato</option>
                                        <option value="Grasa">Grasa</option>
                                        <option value="Vegetal">Vegetal</option>
                                        <option value="Fruta">Fruta</option>
                                        <option value="Lácteo">Lácteo</option>
                                        <option value="Suplemento">Suplemento</option>
                                        <option value="Otro">Otro</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Porción Base</label>
                                    <input type="text" id="e-portion" required class="w-full glass-input p-3 rounded-xl text-xs font-mono" placeholder="Ej: 100g, 1 taza...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- MATRIZ BIOQUÍMICA (MACROS) -->
                    <div class="bg-white/[0.02] border border-white/5 p-6 rounded-2xl">
                        <h3 class="text-[10px] font-black uppercase text-emerald-400 tracking-widest mb-4 border-b border-white/5 pb-2">Matriz Bioquímica (Por porción)</h3>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <!-- Calorías -->
                            <div class="relative">
                                <label class="block text-[10px] font-black text-gray-400 uppercase mb-2">Energía</label>
                                <div class="flex items-end gap-1">
                                    <input type="number" step="0.1" id="e-calories" required class="w-full glass-input p-3 rounded-xl text-xl font-black text-white text-center !border-gray-500/30">
                                    <span class="text-[9px] font-bold text-gray-500 mb-2">Kcal</span>
                                </div>
                            </div>

                            <!-- Proteínas -->
                            <div class="relative">
                                <label class="block text-[10px] font-black text-rose-400 uppercase mb-2">Proteínas</label>
                                <div class="flex items-end gap-1">
                                    <input type="number" step="0.1" id="e-protein" required class="w-full glass-input p-3 rounded-xl text-xl font-black text-rose-400 text-center !border-rose-500/30 !bg-rose-500/5">
                                    <span class="text-[9px] font-bold text-gray-500 mb-2">g</span>
                                </div>
                            </div>

                            <!-- Carbohidratos -->
                            <div class="relative">
                                <label class="block text-[10px] font-black text-[#FFC300] uppercase mb-2">Carbohidratos</label>
                                <div class="flex items-end gap-1">
                                    <input type="number" step="0.1" id="e-carbs" required class="w-full glass-input p-3 rounded-xl text-xl font-black text-[#FFC300] text-center !border-[#FFC300]/30 !bg-[#FFC300]/5">
                                    <span class="text-[9px] font-bold text-gray-500 mb-2">g</span>
                                </div>
                            </div>

                            <!-- Grasas -->
                            <div class="relative">
                                <label class="block text-[10px] font-black text-sky-400 uppercase mb-2">Lípidos (Grasas)</label>
                                <div class="flex items-end gap-1">
                                    <input type="number" step="0.1" id="e-fats" required class="w-full glass-input p-3 rounded-xl text-xl font-black text-sky-400 text-center !border-sky-500/30 !bg-sky-500/5">
                                    <span class="text-[9px] font-bold text-gray-500 mb-2">g</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- OBSERVACIONES TÉCNICAS -->
                    <div>
                        <label class="block text-[9px] font-bold text-gray-500 uppercase tracking-widest mb-1.5 ml-1">Observaciones / Micronutrientes (Opcional)</label>
                        <textarea id="e-notes" rows="2" class="w-full glass-input p-3 rounded-xl text-xs resize-none" placeholder="Ej: Alto en sodio, buena fuente de fibra..."></textarea>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script src="/static/js/admin/admin_middleware.js?v=7.0"></script>
    <script src="/static/js/admin/eats.js?v=7.0"></script>
</body>
</html>
