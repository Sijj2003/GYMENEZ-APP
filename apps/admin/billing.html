<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ ADMIN | Auditoría Fiscal</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="bg-[#030305] text-white selection:bg-emerald-500 selection:text-black min-h-screen flex flex-col font-sans">

    <div id="admin-toast" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none border border-white/10"></div>

    <header class="w-full border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black uppercase tracking-tighter">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                    <span class="text-gray-400 text-xs font-mono tracking-widest ml-2">CORE_BILLING</span>
                </h1>
            </div>
            <a href="/apps/admin/dashboard.html" class="px-5 py-2 rounded-full border border-white/10 text-gray-400 hover:text-white font-bold text-[10px] uppercase tracking-widest transition">Dashboard</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto w-full px-6 py-10 flex-grow flex flex-col">
        
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4 border-b border-white/5 pb-6">
            <div>
                <p class="text-gray-500 text-[9px] font-black uppercase tracking-[0.4em] mb-1">Tesorería Central</p>
                <h2 class="text-3xl font-black text-white uppercase tracking-tighter">Auditoría Fiscal</h2>
            </div>
            <button onclick="fetchPendingPayments()" class="px-6 py-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 text-white text-[10px] font-black uppercase tracking-widest transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Refrescar Bandeja
            </button>
        </div>

        <div id="admin-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="w-8 h-8 border-2 border-white/10 border-t-emerald-500 rounded-full animate-spin mb-3"></div>
            <p class="text-gray-600 text-[9px] font-black uppercase tracking-widest">Buscando pagos pendientes...</p>
        </div>

        <div id="billing-workspace" class="hidden flex-col w-full gap-6">
            <div class="glass-panel rounded-[24px] border border-white/5 bg-black/20 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="border-b border-white/5 bg-white/[0.02] text-gray-400 font-black uppercase tracking-widest text-[9px]">
                                <th class="p-5">Fecha / Hora</th>
                                <th class="p-5">Plan Solicitado</th>
                                <th class="p-5">Referencia</th>
                                <th class="p-5 text-right">Monto Reportado</th>
                                <th class="p-5 text-right">Aprobar / Rechazar</th>
                            </tr>
                        </thead>
                        <tbody id="pending-payments-tbody" class="divide-y divide-white/[0.03] font-medium text-gray-300">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <div id="totp-modal" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[10000] hidden flex-col justify-center items-center opacity-0 transition-opacity duration-300 p-4">
        <div class="glass-panel w-full max-w-sm rounded-[32px] border-t border-sky-500/30 p-8 transform scale-95 transition-transform duration-300 text-center shadow-[0_0_50px_rgba(14,165,233,0.15)]" id="totp-content">
            <div class="w-16 h-16 mx-auto bg-sky-500/10 rounded-full flex items-center justify-center border border-sky-500/30 mb-6 shadow-[0_0_20px_rgba(14,165,233,0.2)]">
                <svg class="w-8 h-8 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 class="text-2xl font-black uppercase tracking-tighter text-white mb-2">Seguridad 2FA</h3>
            <p class="text-gray-400 text-[10px] font-medium leading-relaxed mb-6 uppercase tracking-widest">
                Abre tu Google Authenticator e ingresa el token de seguridad temporal para autorizar esta transacción.
            </p>
            
            <input type="text" id="totp-input" maxlength="6" inputmode="numeric" placeholder="------" class="w-full bg-black/60 border border-sky-500/30 p-4 rounded-xl text-center text-3xl font-mono text-white tracking-[0.5em] focus:border-sky-400 outline-none mb-6">
            
            <div class="flex flex-col gap-3">
                <button onclick="executePaymentVerification()" id="btn-totp-verify" class="w-full py-4 rounded-xl bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-black uppercase tracking-[0.2em] transition-all shadow-lg">Confirmar Operación</button>
                <button onclick="closeTOTPModal()" class="w-full py-3 rounded-xl bg-transparent text-gray-500 hover:text-white text-[9px] font-bold uppercase tracking-widest transition-all">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/admin/admin_middleware.js"></script>
    <script src="/static/js/admin/billing.js"></script>
</body>
</html>
