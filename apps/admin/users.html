<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gymenez OS | Omni-Dossier B2C</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: transparent; color: white; margin: 0; overflow: hidden; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .executive-input { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.08); color: #ffffff; transition: all 0.2s; }
        .executive-input:focus { border-color: #FFC300; background: rgba(0, 0, 0, 0.8); box-shadow: 0 0 0 2px rgba(255, 195, 0, 0.1); outline: none; }
        .executive-input:disabled { opacity: 0.6; cursor: not-allowed; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chat-slide-in { transform: translateX(0) !important; }
        .chat-slide-out { transform: translateX(100%) !important; }
    </style>
</head>
<body class="h-screen w-full flex selection:bg-[#FFC300] selection:text-black">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-xl text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-300 pointer-events-none text-center bg-[#0a0a0f]/95 border border-white/10 backdrop-blur-md"></div>

    <!-- 📱 COLUMNA IZQUIERDA: DIRECTORIO -->
    <div id="directory-panel" class="w-full md:w-[35%] lg:w-[28%] xl:w-[22%] h-full border-r border-white/5 bg-[#050508]/90 backdrop-blur-2xl flex flex-col shrink-0 relative z-20">
        <div class="p-5 border-b border-white/5 shrink-0 bg-[#0a0a0f]">
            <div class="flex justify-between items-center mb-5">
                <div>
                    <h2 class="text-xl font-[900] tracking-tighter uppercase text-white leading-none">Omni-Dossier</h2>
                    <p class="text-[9px] font-bold text-gray-500 uppercase tracking-widest mt-1">Directorio de Atletas</p>
                </div>
                <button onclick="window.openCreateMode()" class="w-9 h-9 rounded-xl bg-white/10 text-white flex items-center justify-center hover:bg-white hover:text-black transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                </button>
            </div>
            <div class="relative">
                <svg class="w-4 h-4 text-gray-500 absolute left-3.5 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="search-input" placeholder="Buscar por nombre o correo..." class="w-full executive-input pl-10 pr-4 py-3 rounded-xl text-xs font-medium">
            </div>
        </div>

        <div id="users-list" class="flex-1 overflow-y-auto p-3 space-y-1.5 hide-scroll"></div>
    </div>

    <!-- 🖥️ COLUMNA CENTRAL: EXPEDIENTE 360 -->
    <div id="dossier-panel" class="hidden md:flex flex-1 h-full bg-[#030305] flex-col relative z-10 w-full">
        
        <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-6 z-10">
            <div class="w-16 h-16 rounded-2xl bg-white/5 border border-white/10 flex items-center justify-center mb-5 text-gray-600"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></div>
            <h3 class="text-2xl font-[900] uppercase tracking-tighter text-white mb-2">Centro de Comando B2C</h3>
        </div>

        <div id="active-dossier" class="hidden flex-col h-full z-20 fade-in bg-[#030305] w-full">
            
            <div class="px-5 md:px-8 py-6 md:py-8 border-b border-white/5 bg-[#0a0a0f] shrink-0">
                <!-- Botón de retorno móvil -->
                <button onclick="window.closeMobileDossier()" class="md:hidden mb-5 text-gray-400 hover:text-white flex items-center gap-1.5 text-[9px] font-bold uppercase tracking-widest transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg> Volver al Directorio
                </button>

                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div>
                        <div class="flex items-center gap-2.5 mb-3">
                            <span id="d-status" class="px-2.5 py-1 rounded-md text-[9px] font-[900] uppercase tracking-widest bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">ACTIVO</span>
                            <span id="d-tier" class="px-2.5 py-1 rounded-md text-[9px] font-[900] uppercase tracking-widest bg-[#FFC300]/10 text-[#FFC300] border border-[#FFC300]/20">ULTRA</span>
                        </div>
                        <h2 id="d-name" class="text-3xl md:text-4xl font-[900] uppercase tracking-tighter text-white leading-none">Nombre Atleta</h2>
                        <p id="d-email" class="text-xs text-gray-500 font-mono mt-2 tracking-wide">atleta@gymenez.com</p>
                    </div>
                    <div class="flex flex-wrap md:flex-col gap-2 md:items-end w-full md:w-auto">
                        <button onclick="window.togglePulseDrawer()" id="btn-open-chat" class="w-full md:w-auto px-6 py-3 rounded-xl bg-white text-black hover:bg-gray-200 text-[10px] font-[900] uppercase tracking-widest shadow-lg flex justify-center items-center gap-2">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 5.92 2 10.75c0 2.5 1.35 4.74 3.5 6.27V22l3.85-2.02c.85.22 1.74.33 2.65.33 5.52 0 10-3.92 10-8.75S17.52 2 12 2z"/></svg> Soporte Pulse
                        </button>
                        <div class="flex gap-2 w-full md:w-auto justify-end">
                            <button id="btn-block" class="flex-1 md:flex-none px-4 py-2 rounded-lg border border-red-500/20 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white text-[9px] font-bold uppercase tracking-widest">Bloquear</button>
                            <button id="btn-certify" class="flex-1 md:flex-none px-4 py-2 rounded-lg border border-white/10 bg-white/5 text-gray-300 hover:bg-white hover:text-black text-[9px] font-bold uppercase tracking-widest">OTP Clave</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TABS (Identidad, Biolab, Dieta) y sus contenedores aquí (Mismo código de antes) -->
            <!-- ... (Se mantiene el código de los formularios f-name, m-weight, diet-editor, etc.) ... -->
            
            <div class="flex overflow-x-auto hide-scroll gap-6 md:gap-8 px-5 md:px-8 border-b border-white/5 shrink-0 bg-[#050508]">
                <button id="d-tab-identity" onclick="window.switchDossierTab('identity')" class="whitespace-nowrap py-4 border-b-2 border-[#FFC300] text-[#FFC300] font-[900] text-[10px] uppercase tracking-[0.15em] transition-colors relative">Identidad & Plan</button>
                <button id="d-tab-biolab" onclick="window.switchDossierTab('biolab')" class="whitespace-nowrap py-4 border-b-2 border-transparent text-gray-500 font-[900] text-[10px] uppercase tracking-[0.15em] transition-colors relative">Biometría & Metas</button>
                <button id="d-tab-diet" onclick="window.switchDossierTab('diet')" class="whitespace-nowrap py-4 border-b-2 border-transparent text-gray-500 font-[900] text-[10px] uppercase tracking-[0.15em] transition-colors">Nutrición Ultra</button>
            </div>

            <!-- CONTENEDORES DE TABS -->
            <div id="d-content-identity" class="flex-1 overflow-y-auto p-5 md:p-8 hide-scroll block">
                 <form id="user-form" class="space-y-6 max-w-4xl">
                     <input type="hidden" id="f-id"><input type="hidden" id="f-is-edit" value="true">
                     <div class="bg-[#0a0a0f] border border-white/5 p-6 rounded-2xl">
                         <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-5">
                             <div><label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Nombre</label><input type="text" id="f-name" class="w-full executive-input p-3.5 rounded-xl text-sm font-bold uppercase"></div>
                             <div><label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Apellido</label><input type="text" id="f-lastname" class="w-full executive-input p-3.5 rounded-xl text-sm font-bold uppercase"></div>
                         </div>
                         <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                             <div><label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Email</label><input type="email" id="f-email" class="w-full executive-input p-3.5 rounded-xl text-sm font-mono text-gray-300" disabled></div>
                             <div><label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Clave</label><input type="password" id="f-password" class="w-full executive-input p-3.5 rounded-xl text-sm font-mono placeholder-gray-600" disabled></div>
                         </div>
                     </div>
                     <div class="bg-[#0a0a0f] border border-white/5 p-6 rounded-2xl grid grid-cols-1 md:grid-cols-3 gap-5">
                         <div><label class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-1.5">Suscripción</label><select id="f-tier" class="w-full executive-input p-3.5 rounded-xl text-sm font-[900] text-[#FFC300] bg-[#12121a]"><option value="BASICO">BÁSICO</option><option value="PLUS">PLUS</option><option value="ULTRA">ULTRA</option></select></div>
                         <div class="md:col-span-2"><label class="block text-[10px] font-bold text-[#FFC300] uppercase tracking-widest mb-1.5">Vencimiento Fiscal</label><input type="date" id="f-expires" class="w-full executive-input p-3.5 rounded-xl text-sm font-mono text-white border-[#FFC300]/30 bg-[#FFC300]/5"></div>
                     </div>
                     <div class="flex justify-end pt-4 pb-10"><button type="submit" id="f-submit-btn" class="w-full md:w-auto px-8 py-4 rounded-xl bg-[#FFC300] text-black font-[900] text-[10px] uppercase tracking-[0.2em]">Actualizar Expediente</button></div>
                 </form>
            </div>
            
            <div id="d-content-biolab" class="hidden flex-1 overflow-y-auto p-5 md:p-8 hide-scroll">
                <!-- Se inyecta la lógica y forms biométricos aquí (Resumido por brevedad en este prompt) -->
                <form id="metrics-form" class="space-y-6 max-w-5xl mb-12"><div class="flex justify-end"><button type="submit" id="btn-submit-metrics" class="px-8 py-3.5 rounded-xl bg-white text-black font-[900] text-[10px] uppercase tracking-widest">Guardar Biometría</button></div></form>
                <form id="goals-form" class="space-y-6 max-w-5xl pb-12"><div class="flex justify-end"><button type="submit" id="btn-submit-goals" class="px-8 py-4 rounded-xl bg-white text-black font-[900] text-[10px] uppercase tracking-widest">Fijar Matriz</button></div></form>
            </div>

            <div id="d-content-diet" class="hidden flex-1 overflow-y-auto p-5 md:p-8 hide-scroll">
                 <!-- Logica de dietas ultra -->
                 <div id="diet-editor" class="bg-[#0a0a0f] border border-white/5 p-6 md:p-8 rounded-[2rem] max-w-4xl mx-auto pb-12">
                     <textarea id="d-text" rows="18" class="w-full executive-input p-5 rounded-xl text-sm hide-scroll font-mono text-gray-300"></textarea>
                     <div class="flex justify-end pt-4"><button onclick="window.saveDiet()" id="btn-save-diet" class="px-8 py-4 rounded-xl bg-emerald-500 text-black text-[10px] font-[900] uppercase tracking-widest">Publicar en App</button></div>
                 </div>
            </div>

        </div>
    </div>

    <!-- 🎧 PANEL DERECHO: PULSE SLIDE-OVER -->
    <div id="pulse-drawer" class="fixed top-0 right-0 h-full w-full sm:w-[400px] bg-[#050508]/95 backdrop-blur-3xl border-l border-white/10 z-[100] transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col shadow-2xl">
        <div class="px-5 py-4 border-b border-white/5 bg-[#0a0a0f] flex justify-between items-center shrink-0">
            <!-- Header Chat (Acortado por brevedad) -->
            <button onclick="window.togglePulseDrawer()" class="w-8 h-8 rounded-full bg-white/5 text-gray-400 hover:text-white hover:bg-white/10 flex items-center justify-center">X</button>
        </div>
        <div id="messages-area" class="flex-1 overflow-y-auto p-5 hide-scroll space-y-5 bg-[#030305]"></div>
        <div class="p-4 shrink-0 bg-[#0a0a0f] border-t border-white/5">
            <form id="admin-chat-form" class="relative">
                <textarea id="admin-chat-input" rows="1" class="w-full executive-input px-4 py-3.5 pr-12 rounded-xl text-sm resize-none hide-scroll leading-snug"></textarea>
                <button type="submit" id="admin-send-btn" class="absolute right-2 bottom-2 w-9 h-9 bg-white text-black rounded-lg">-></button>
            </form>
        </div>
    </div>

    <!-- MODAL OTP (Se mantiene intacto su HTML) -->
    
    <!-- 🚀 MICROSERVICIOS JAVASCRIPT -->
    <!-- 1. Seguridad Global -->
    <script src="/static/js/admin/admin_middleware.js"></script>
    <!-- 2. Notificaciones Globales de Radar -->
    <script type="module" src="/static/js/admin/radar_admin.js"></script>
    
    <!-- 3. Módulos Específicos del Omni-Dossier -->
    <script src="/static/js/admin/omni_core.js"></script>
    <script src="/static/js/admin/omni_biolab.js"></script>
    <script type="module" src="/static/js/admin/omni_pulse.js"></script>
</body>
</html>
