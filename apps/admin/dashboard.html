<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gymenez OS | Command Center</title>
    
    <link rel="icon" type="image/svg+xml" href="/static/img/logos/mini_logo.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #030305; 
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Ocultar scrollbars globalmente para mantener la limpieza */
        ::-webkit-scrollbar { display: none; }
        
        /* 💎 GLASSMORPHISM LATERAL */
        .glass-sidebar {
            background: rgba(10, 10, 15, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* 🎛️ BOTONES DE NAVEGACIÓN */
        .os-nav-link {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .os-nav-link::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%) scaleY(0);
            height: 60%;
            width: 3px;
            background-color: #FFC300;
            border-radius: 0 4px 4px 0;
            transition: transform 0.3s ease;
        }
        .os-nav-link.active {
            background: linear-gradient(90deg, rgba(255,195,0,0.1) 0%, transparent 100%);
        }
        .os-nav-link.active::before {
            transform: translateY(-50%) scaleY(1);
        }

        /* ✨ ANIMACIONES DE CARGA DEL IFRAME */
        .iframe-enter {
            animation: iframeEnter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes iframeEnter {
            from { opacity: 0; transform: scale(0.99) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .loader-ring {
            border: 3px solid rgba(255, 195, 0, 0.1);
            border-top-color: #FFC300;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-white h-screen w-screen flex flex-col md:flex-row selection:bg-[#FFC300] selection:text-black">

    <!-- 📱 HEADER MÓVIL (Solo visible en pantallas pequeñas) -->
    <header class="md:hidden glass-sidebar w-full h-16 flex items-center justify-between px-5 shrink-0 z-50 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-lg bg-[#FFC300]/10 border border-[#FFC300]/20 flex items-center justify-center">
                <span class="text-[#FFC300] font-[900] italic leading-none">G</span>
            </div>
            <span class="font-[900] tracking-widest uppercase text-xs">Gymenez <span class="text-[#FFC300]">OS</span></span>
        </div>
        <button id="mobile-menu-btn" class="text-gray-400 hover:text-white transition-colors focus:outline-none">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </header>

    <!-- 🖥️ SIDEBAR (Navegación Principal) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 w-64 glass-sidebar h-full flex flex-col justify-between pt-8 pb-6 transition-transform duration-400 ease-out z-[100] md:z-auto shadow-2xl md:shadow-none">
        
        <!-- Botón cerrar móvil -->
        <button id="close-sidebar-btn" class="md:hidden absolute top-5 right-5 text-gray-500 hover:text-white">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>

        <!-- BRANDING -->
        <div class="flex flex-col items-center md:items-start px-8 mb-10">
            <div class="flex items-center gap-3 mb-2">
                <div class="w-10 h-10 bg-gradient-to-br from-[#FFC300] to-yellow-600 rounded-xl flex items-center justify-center shadow-[0_0_20px_rgba(255,195,0,0.3)]">
                    <span class="font-[900] italic text-black text-xl leading-none">G</span>
                </div>
                <div>
                    <h1 class="font-[900] tracking-tight uppercase text-sm leading-none">GYMENEZ</h1>
                    <span class="text-[#FFC300] text-[9px] font-black tracking-[0.3em] uppercase">Core System</span>
                </div>
            </div>
            <div class="w-full h-px bg-gradient-to-r from-white/10 to-transparent mt-6"></div>
        </div>

        <!-- ENLACES A SÚPER MÓDULOS -->
        <div class="flex-1 flex flex-col gap-1.5 px-4 overflow-y-auto">
            
            <p class="text-[9px] font-bold text-gray-600 uppercase tracking-widest px-4 mb-2 mt-2">Gestión Operativa</p>

            <!-- 1. Omni-Dossier B2C -->
            <button data-url="/apps/admin/users.html" class="os-nav-link group flex items-center px-4 py-3.5 rounded-xl text-left relative overflow-hidden">
                <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <div class="ml-3">
                    <span class="block font-bold text-xs tracking-wide uppercase text-gray-400 group-hover:text-white transition-colors">Omni-Dossier</span>
                    <span class="block text-[9px] text-gray-600 font-medium">Atletas & Soporte</span>
                </div>
            </button>

            <!-- 2. B2B Command -->
            <button data-url="/apps/admin/b2b_command.html" class="os-nav-link group flex items-center px-4 py-3.5 rounded-xl text-left relative overflow-hidden">
                <svg class="w-5 h-5 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <div class="ml-3">
                    <span class="block font-bold text-xs tracking-wide uppercase text-gray-400 group-hover:text-white transition-colors">B2B Command</span>
                    <span class="block text-[9px] text-gray-600 font-medium">Partners & Finanzas</span>
                </div>
            </button>

            <p class="text-[9px] font-bold text-gray-600 uppercase tracking-widest px-4 mb-2 mt-6">Bóvedas de Contenido</p>

            <!-- 3. Rutinas -->
            <button data-url="/apps/admin/routines.html" class="os-nav-link group flex items-center px-4 py-3 rounded-xl text-left relative overflow-hidden">
                <svg class="w-4 h-4 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <span class="ml-3 font-semibold text-xs tracking-wide uppercase text-gray-400 group-hover:text-white transition-colors">Lab. Fitness</span>
            </button>

            <!-- 4. Eats -->
            <button data-url="/apps/admin/eats.html" class="os-nav-link group flex items-center px-4 py-3 rounded-xl text-left relative overflow-hidden">
                <svg class="w-4 h-4 text-gray-500 group-hover:text-emerald-400 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="ml-3 font-semibold text-xs tracking-wide uppercase text-gray-400 group-hover:text-white transition-colors">Bóveda Eats</span>
            </button>

            <!-- 5. ON -->
            <button data-url="/apps/admin/on.html" class="os-nav-link group flex items-center px-4 py-3 rounded-xl text-left relative overflow-hidden">
                <svg class="w-4 h-4 text-gray-500 group-hover:text-red-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="ml-3 font-semibold text-xs tracking-wide uppercase text-gray-400 group-hover:text-white transition-colors">Gymenez ON</span>
            </button>
            
        </div>

        <!-- ÁREA DE USUARIO Y LOGOUT -->
        <div class="px-6 mt-4">
            <div class="bg-black/30 border border-white/5 rounded-2xl p-4 flex flex-col gap-3">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center shrink-0">
                        <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-[10px] font-bold text-white uppercase truncate">Administrador</p>
                        <p class="text-[8px] text-gray-500 font-mono tracking-widest truncate">Secure Session</p>
                    </div>
                </div>
                
                <button id="btn-logout" class="w-full flex items-center justify-center gap-2 py-2.5 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/20 transition-all duration-300">
                    <span class="text-[9px] font-black uppercase tracking-widest">Cerrar Sesión</span>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- 🌐 ÁREA PRINCIPAL DE TRABAJO (IFRAME) -->
    <main class="flex-1 h-full relative bg-[#030305]">
        
        <!-- PANTALLA DE CARGA CINEMÁTICA -->
        <div id="os-loader" class="absolute inset-0 z-40 bg-[#030305]/80 backdrop-blur-md flex flex-col items-center justify-center transition-opacity duration-500 pointer-events-none">
            <div class="loader-ring mb-6 shadow-[0_0_30px_rgba(255,195,0,0.2)]"></div>
            <p class="text-[10px] font-[900] tracking-[0.4em] uppercase text-white animate-pulse">Cifrando Conexión</p>
            <p class="text-[8px] text-[#FFC300] font-mono tracking-widest mt-2">Zero-Trust Protocol Active</p>
        </div>

        <iframe id="os-frame" src="" class="w-full h-full border-0 opacity-0 transition-opacity duration-700 ease-in-out"></iframe>
    </main>

    <!-- SCRIPT DE NAVEGACIÓN Y CONTROL DEL SHELL -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const frame = document.getElementById('os-frame');
            const loader = document.getElementById('os-loader');
            const navLinks = document.querySelectorAll('.os-nav-link');
            const btnLogout = document.getElementById('btn-logout');
            
            // Lógica Menú Móvil
            const sidebar = document.getElementById('sidebar');
            const mobileMenuBtn = document.getElementById('mobile-menu-btn');
            const closeSidebarBtn = document.getElementById('close-sidebar-btn');

            function toggleMobileMenu() {
                if (sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.remove('-translate-x-full');
                } else {
                    sidebar.classList.add('-translate-x-full');
                }
            }

            mobileMenuBtn.addEventListener('click', toggleMobileMenu);
            closeSidebarBtn.addEventListener('click', toggleMobileMenu);

            // Lógica de Navegación "App Shell"
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetUrl = link.getAttribute('data-url');
                    
                    if (frame.src.includes(targetUrl)) {
                        if(window.innerWidth < 768) toggleMobileMenu(); // Cierra en móvil si ya estás ahí
                        return;
                    }

                    // Reset visual de botones
                    navLinks.forEach(l => {
                        l.classList.remove('active');
                        const icon = l.querySelector('svg');
                        const titles = l.querySelectorAll('span');
                        if(icon) { icon.classList.remove('text-white'); icon.classList.add('text-gray-500'); }
                        titles.forEach(t => t.classList.remove('text-white'));
                    });

                    // Activar botón clickeado
                    link.classList.add('active');
                    const activeIcon = link.querySelector('svg');
                    const activeTitles = link.querySelectorAll('span');
                    if(activeIcon) { activeIcon.classList.add('text-white'); activeIcon.classList.remove('text-gray-500'); }
                    activeTitles.forEach(t => t.classList.add('text-white'));

                    // Transición Cinemática
                    frame.classList.remove('iframe-enter');
                    frame.classList.add('opacity-0'); 
                    loader.classList.remove('opacity-0', 'hidden'); 
                    
                    setTimeout(() => {
                        frame.src = targetUrl;
                    }, 300);

                    // Autocierre del menú en móviles
                    if(window.innerWidth < 768) toggleMobileMenu();
                });
            });

            // Receptor de Carga Exitosa
            frame.addEventListener('load', () => {
                if (frame.src && frame.src !== window.location.href && frame.src !== 'about:blank') {
                    loader.classList.add('opacity-0');
                    frame.classList.remove('opacity-0');
                    frame.classList.add('iframe-enter');
                    
                    setTimeout(() => { loader.classList.add('hidden'); }, 500);
                }
            });

            // Cierre de Sesión Seguro
            btnLogout.addEventListener('click', () => {
                if(confirm('¿Finalizar sesión administrativa y destruir caché local?')) {
                    localStorage.removeItem('adminSession'); 
                    localStorage.removeItem('gymen_admin_token'); 
                    window.top.location.href = '/apps/admin/login.html'; 
                }
            });

            // Arranque inicial automático (Dispara el Omni-Dossier B2C)
            if (navLinks.length > 0) {
                setTimeout(() => { navLinks[0].click(); }, 150);
            }
        });
    </script>
    
    <!-- Middleware de Seguridad (Si lo usas en el shell) -->
    <script src="/static/js/admin/admin_middleware.js"></script>
</body>
</html>
