<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gymenez OS | Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tipografía y scrollbar invisible estilo Apple */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden flex selection:bg-[#FFC300] selection:text-black">

    <nav class="w-20 md:w-64 h-full bg-[#111111]/80 backdrop-blur-2xl border-r border-white/5 flex flex-col justify-between pt-8 pb-6 transition-all duration-300 z-50">
        
        <div class="flex items-center justify-center md:justify-start md:px-8 mb-10">
            <div class="w-10 h-10 bg-gradient-to-br from-[#FFC300] to-orange-500 rounded-xl flex items-center justify-center shadow-lg shadow-[#FFC300]/20">
                <span class="font-black text-black text-xl tracking-tighter">G</span>
            </div>
            <span class="hidden md:block ml-4 font-black tracking-widest uppercase text-sm">Gymenez OS</span>
        </div>

        <div class="flex-1 flex flex-col gap-2 px-3 md:px-4 overflow-y-auto">
            
            <button data-url="/apps/admin/users.html" class="os-nav-link active group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 bg-white/10 border border-white/10 hover:bg-white/10 relative overflow-hidden">
                <svg class="w-6 h-6 text-white group-hover:scale-110 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase">Directorio 360</span>
            </button>

            <button data-url="/apps/admin/routines.html" class="os-nav-link group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 border border-transparent hover:bg-white/5 relative overflow-hidden">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-[#FFC300] group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase text-gray-400 group-hover:text-white transition-colors">Laboratorio</span>
            </button>

            <button data-url="/apps/admin/eats.html" class="os-nav-link group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 border border-transparent hover:bg-white/5 relative overflow-hidden">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-emerald-400 group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase text-gray-400 group-hover:text-white transition-colors">Bóveda Eats</span>
            </button>

            <button data-url="/apps/admin/on.html" class="os-nav-link group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 border border-transparent hover:bg-white/5 relative overflow-hidden">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-red-500 group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase text-gray-400 group-hover:text-white transition-colors">Gymenez ON</span>
            </button>

            <button data-url="/apps/admin/pulse.html" class="os-nav-link group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 border border-transparent hover:bg-white/5 relative overflow-hidden">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-sky-400 group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 4v-4z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase text-gray-400 group-hover:text-white transition-colors">Pulse Center</span>
            </button>

            <button data-url="/apps/admin/billing.html" class="os-nav-link group flex items-center p-3 md:p-4 rounded-xl transition-all duration-300 border border-transparent hover:bg-white/5 relative overflow-hidden">
                <svg class="w-6 h-6 text-gray-500 group-hover:text-white group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span class="hidden md:block ml-4 font-semibold text-xs tracking-widest uppercase text-gray-400 group-hover:text-white transition-colors">Tesorería</span>
            </button>
        </div>

        <div class="px-3 md:px-4">
            <button id="btn-logout" class="w-full flex items-center justify-center p-3 rounded-xl bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white border border-red-500/20 hover:border-red-500 transition-all duration-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            </button>
        </div>
    </nav>

    <main class="flex-1 h-full relative bg-[#050505]">
        
        <div id="os-loader" class="absolute inset-0 z-40 bg-[#050505] flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-12 h-12 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin shadow-[0_0_15px_rgba(255,195,0,0.5)]"></div>
            <p class="mt-4 text-[10px] font-black tracking-[0.3em] uppercase text-gray-500 animate-pulse">Sincronizando</p>
        </div>

        <iframe id="os-frame" src="" class="w-full h-full border-0 opacity-0 transition-opacity duration-700 ease-in-out"></iframe>
    </main>

    <script src="/static/js/admin/admin_middleware.js"></script>
    <script src="/static/js/admin/dashboard.js"></script>
    <script type="module" src="/static/js/admin/radar_admin.js"></script>
</body>
</html>
