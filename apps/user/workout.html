<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | Comando de Entrenamiento</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        /* Ocultar scrollbar en el selector de días horizontal */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Efecto de ejercicio completado */
        .exercise-done {
            opacity: 0.6;
            border-color: rgba(52, 211, 153, 0.3) !important;
        }
        .exercise-done .done-btn {
            background-color: #059669 !important; /* Emerald 600 */
            color: white !important;
            border-color: #059669 !important;
        }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col bg-[#030305]">

    <!-- Notificaciones flotantes UI -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 md:px-6 py-2 md:py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center w-11/12 max-w-[350px] border border-white/10"></div>

    <!-- Fondos -->
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/80 via-[#030305]/95 to-[#030305] -z-10"></div>
    <div class="fixed inset-0 bg-[url('/static/img/backgrounds/FONDO.png')] bg-cover bg-center opacity-5 -z-20 mix-blend-screen grayscale"></div>

    <!-- Header -->
    <header class="w-full border-b border-white/5 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-black uppercase tracking-tighter block">
                <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
            </h1>
            <a href="/apps/start/inicio.html" class="px-5 py-2 rounded-full border border-white/10 text-white font-bold text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition">
                Volver al Hub
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 md:px-6 py-6 md:py-10 flex-grow flex flex-col">
        
        <!-- Encabezado del Módulo -->
        <div class="mb-6 fade-in-up">
            <p class="text-[#FFC300] text-[9px] font-black uppercase tracking-[0.4em] mb-1">Módulo Operativo</p>
            <h2 class="text-3xl md:text-5xl font-black uppercase tracking-tighter text-white leading-none">Workout <span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-300 to-gray-600">Hub</span></h2>
        </div>

        <!-- Spinner de Carga Inicial -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Sincronizando Bloques...</p>
        </div>

        <!-- CONTENEDOR PRINCIPAL DEL ENTRENAMIENTO -->
        <div id="workout-container" class="hidden flex-col gap-6 w-full">
            
            <!-- Selector Horizontal de Días -->
            <div class="w-full overflow-x-auto hide-scrollbar pb-2">
                <div class="flex gap-3 min-w-max" id="day-selector">
                    <!-- Los botones de los días se inyectarán vía JS -->
                </div>
            </div>

            <!-- Cabecera de la Rutina Diaria -->
            <div class="glass-panel rounded-2xl p-5 md:p-6 border-l-4 border-l-[#FFC300] bg-gradient-to-r from-[#FFC300]/5 to-transparent flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h3 id="routine-title" class="text-xl md:text-2xl font-black uppercase tracking-tighter text-white">Cargando Rutina...</h3>
                    <p id="routine-desc" class="text-gray-400 text-[11px] md:text-xs font-medium uppercase tracking-widest mt-1">--</p>
                </div>
                
                <!-- Progreso del Día -->
                <div class="w-full md:w-48">
                    <div class="flex justify-between text-[9px] font-black uppercase tracking-widest text-gray-400 mb-1.5">
                        <span>Progreso</span>
                        <span id="workout-progress-text" class="text-[#FFC300]">0%</span>
                    </div>
                    <div class="w-full bg-black/50 h-2 rounded-full overflow-hidden border border-white/5">
                        <div id="workout-progress-bar" class="h-full bg-[#FFC300] transition-all duration-500" style="width: 0%;"></div>
                    </div>
                </div>
            </div>

            <!-- Estado Vacío (Día de Descanso) -->
            <div id="rest-day-state" class="hidden flex-col items-center justify-center py-16 px-4 bg-white/[0.01] border border-white/5 rounded-3xl text-center">
                <div class="w-14 h-14 bg-white/5 rounded-full flex items-center justify-center border border-white/10 text-gray-500 mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4m16 0a8 8 0 11-16 0 8 8 0 0116 0z"></path></svg>
                </div>
                <h4 class="text-white text-lg font-black uppercase tracking-widest">Día de Recuperación</h4>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-wide mt-2 max-w-xs">El crecimiento ocurre fuera del gimnasio. Optimiza tu nutrición y descanso celular.</p>
            </div>

            <!-- Lista de Ejercicios -->
            <div id="exercises-list" class="flex flex-col gap-4">
                <!-- Las tarjetas de ejercicio se renderizan aquí -->
            </div>

        </div>

    </main>

    <footer class="text-center py-6 border-t border-white/5 bg-[#030305]/80 backdrop-blur-md mt-auto">
        <p class="text-[8px] md:text-[9px] font-bold uppercase tracking-[0.4em] text-gray-600">© 2026 GYMENEZ PERFORMANCE • TACTICAL TRAINING</p>
    </footer>

    <!-- Lógica JS -->
    <script src="/static/js/auth/auth_middleware.js"></script>
    <script src="/static/js/dashboard/workout.js"></script>
</body>
</html>
