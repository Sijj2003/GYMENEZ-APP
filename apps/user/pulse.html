<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | Central Pulse</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos modulares core -->
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col bg-[#030305]">

    <!-- Notificaciones flotantes UI -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 md:px-6 py-2 md:py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center w-11/12 max-w-[350px] border border-white/10"></div>

    <!-- Fondos de Gradiente y Textura de Marca -->
    <div class="fixed inset-0 bg-[url('/static/img/backgrounds/FONDO.png')] bg-cover bg-center opacity-10 -z-10 mix-blend-screen grayscale"></div>
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/40 via-[#030305]/95 to-[#030305] -z-10"></div>

    <!-- Header Universal -->
    <header class="w-full border-b border-white/5 bg-black/30 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 md:gap-3">
                <h1 class="text-lg md:text-xl font-black uppercase tracking-tighter block">
                    <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
                </h1>
            </div>
            <a href="/apps/start/inicio.html" class="px-5 py-2 rounded-full border border-white/10 text-white font-bold text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition">
                Volver al Hub
            </a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-4 md:px-6 py-8 md:py-12 flex-grow flex flex-col">
        
        <!-- Bloque de Encabezado y Soporte -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10 pb-6 border-b border-white/5">
            <div>
                <p class="text-[#FFC300] text-[9px] font-black uppercase tracking-[0.4em] mb-1">Centro de Despacho</p>
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter leading-none">GYMENEZ <span class="text-white">PULSE</span></h2>
            </div>
            
            <!-- 📞 Botón de Soporte a WhatsApp Rediseñado y Más Grueso -->
            <a href="https://wa.me/584148780392?text=Hola,%20necesito%20soporte%20técnico%20con%20mi%20cuenta%20de%20GYMENEZ." 
               target="_blank" 
               class="inline-flex items-center gap-2.5 bg-emerald-600/10 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/20 px-5 py-3 rounded-xl text-[10px] uppercase font-black tracking-widest shadow-lg transition-all duration-300 transform hover:scale-[1.02]">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946C.06 5.348 5.397.01 12.008.01c3.202.001 6.212 1.246 8.477 3.514 2.266 2.268 3.507 5.28 3.505 8.484-.004 6.657-5.34 11.997-11.953 11.997-2.005-.001-3.973-.502-5.713-1.455L0 24zm6.79-4.141l.406.241c1.559.926 3.344 1.415 5.171 1.416 5.58-.001 10.12-4.545 10.124-10.13a9.141 9.141 0 0 0-2.695-6.495 9.191 9.191 0 0 0-6.493-2.696c-5.586 0-10.123 4.542-10.127 10.129-.001 1.896.493 3.75 1.429 5.33l.264.448L3.997 21.3l3.072-.806-.222-.135z"/>
                </svg>
                Solicitar Soporte
            </a>
        </div>

        <!-- Spinner de Carga Inicial -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Interceptando Señales...</p>
        </div>

        <!-- 🔔 CONTENEDOR DINÁMICO DE MENSAJES (Sincronizado por JS) -->
        <div id="pulse-container" class="hidden flex-col gap-4">
            <!-- Los mensajes se inyectarán de forma atómica desde el JavaScript -->
        </div>

        <!-- Estado Vacío (Fallback si no hay notificaciones en la Base de Datos) -->
        <div id="pulse-empty-state" class="hidden flex-col items-center justify-center text-center py-16 px-4 bg-white/[0.01] border border-white/5 rounded-3xl">
            <div class="w-12 h-12 bg-white/5 rounded-full flex items-center justify-center border border-white/10 text-gray-400 mb-4">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0a2 2 0 01-2 2H6a2 2 0 01-2-2m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5a2 2 0 012-2h2m2 0h4a2 2 0 012 2v3m2 4H10"></path></svg>
            </div>
            <h4 class="text-white text-sm font-black uppercase tracking-widest">Canal Limpio</h4>
            <p class="text-gray-500 text-xs font-bold uppercase tracking-wide mt-1.5">No hay transmisiones ni alertas activas en este momento.</p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 border-t border-white/5 bg-[#030305]/80 backdrop-blur-md mt-auto">
        <p class="text-[8px] md:text-[9px] font-bold uppercase tracking-[0.4em] text-gray-600">© 2026 GYMENEZ PERFORMANCE • PULSE ENGINE</p>
    </footer>

    <!-- Middleware y Lógica -->
    <script src="/static/js/auth/auth_middleware.js"></script>
    <script src="/static/js/dashboard/pulse.js"></script>
</body>
</html>
