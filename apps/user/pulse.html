<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GYMENEZ | Pulse Chat</title>
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 0px; } /* Chat ultralimpio sin scroll visible */
        body { overscroll-behavior-y: none; background-color: #000; }
        
        /* Animaciones Pulse Premium */
        .message-bubble { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="selection:bg-[#FFC300] selection:text-black overflow-hidden h-[100dvh] flex flex-col relative">

    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 py-2 rounded-full text-[10px] font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 pointer-events-none text-center border"></div>

    <header class="absolute top-0 w-full bg-gradient-to-b from-black/80 to-transparent pt-4 pb-10 px-6 z-50 flex justify-between items-start pointer-events-none">
        <div>
            <h1 class="text-xl font-black uppercase tracking-tighter block pointer-events-auto shadow-sm">
                <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
            </h1>
            <p id="chat-status-text" class="text-[9px] text-gray-300 font-bold uppercase tracking-widest mt-0.5 flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-gray-500 rounded-full"></span> Conectando...</p>
        </div>
        <button onclick="if(history.length > 1) { history.back(); } else { window.location.href='/apps/start/inicio.html'; }" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white pointer-events-auto border border-white/20 hover:bg-white/20 transition-all">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </header>

    <main class="flex-grow flex flex-col h-full w-full max-w-2xl mx-auto relative pt-20 pb-24">
        
        <div id="chat-messages-area" class="flex-grow overflow-y-auto px-4 space-y-3 custom-scrollbar flex flex-col pt-4">
            <div class="flex justify-center my-4 shrink-0">
                <span id="system-badge-text" class="px-3 py-1 bg-white/10 backdrop-blur text-white rounded-full text-[9px] font-black tracking-widest uppercase">Pulse Message</span>
            </div>
        </div>

        <div id="chat-request-overlay" class="absolute inset-0 z-20 bg-black/60 backdrop-blur-lg flex flex-col items-center justify-center p-6 transition-all duration-500">
            <div class="w-16 h-16 bg-[#FFC300]/10 rounded-full flex items-center justify-center border border-[#FFC300]/30 mb-6">
                <svg class="w-8 h-8 text-[#FFC300]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h3 class="text-2xl font-black uppercase text-white tracking-tighter mb-2">Soporte Central</h3>
            <p id="request-status-msg" class="text-xs text-gray-400 font-medium text-center max-w-xs mb-8">La línea está cerrada. Solicita un ticket para abrir comunicación directa con tu preparador.</p>
            <button id="btn-request-support" class="btn-gold w-full max-w-xs py-4 rounded-[18px] text-[11px] font-black uppercase tracking-[0.2em] shadow-[0_0_20px_rgba(255,195,0,0.2)] transition-transform active:scale-95">Abrir Ticket Seguro</button>
            <button id="btn-view-history" class="mt-4 text-gray-500 hover:text-white text-[10px] font-black uppercase tracking-widest transition-colors">Revisar Historial Reciente</button>
        </div>

        <div id="chat-input-area" class="hidden absolute bottom-4 left-4 right-4 z-30">
            <form id="chat-form" class="flex gap-2 items-end bg-[#1c1c1e]/90 backdrop-blur-xl border border-white/10 p-1.5 rounded-[24px] shadow-2xl">
                <textarea id="chat-input" rows="1" class="flex-grow bg-transparent text-white text-sm px-4 py-3 outline-none resize-none custom-scrollbar leading-snug" placeholder="Pulse Message..." required></textarea>
                <button type="submit" class="w-10 h-10 shrink-0 bg-[#FFC300] text-black rounded-[20px] flex items-center justify-center transition-transform active:scale-90 shadow-md">
                    <svg class="w-4 h-4 translate-x-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z"/></svg>
                </button>
            </form>
        </div>

        <div id="chat-action-bar-closed" class="hidden absolute bottom-4 left-4 right-4 z-30">
            <div class="flex justify-between items-center bg-[#1c1c1e]/95 backdrop-blur-2xl border border-white/10 p-3 px-5 rounded-[24px] shadow-2xl">
                <span class="text-gray-400 text-[10px] font-black uppercase tracking-widest">Modo Historial Activo</span>
                <button id="btn-show-overlay" class="px-5 py-2.5 bg-[#FFC300] text-black text-[10px] font-black uppercase tracking-widest rounded-full transition-transform active:scale-95 shadow-md shadow-[0_0_15px_rgba(255,195,0,0.3)]">Solicitar Ticket</button>
            </div>
        </div>

    </main>

    <script src="/static/js/auth/auth_middleware.js"></script>
    <script type="module" src="/static/js/dashboard/pulse.js"></script>
    <script>
        const tx = document.getElementById('chat-input');
        if(tx) {
            tx.addEventListener("input", function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
                if(this.scrollHeight > 100) { this.style.overflowY = 'auto'; this.style.height = '100px'; } 
                else { this.style.overflowY = 'hidden'; }
            }, false);
        }
    </script>
</body>
</html>
