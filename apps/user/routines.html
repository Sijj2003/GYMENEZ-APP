<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GYMENEZ | Programa de Entrenamiento</title>
    
    <link rel="icon" type="image/png" href="/static/img/logos/mini_logo.png">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Estilos modulares -->
    <link rel="stylesheet" href="/static/css/auth.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body class="selection:bg-[#FFC300] selection:text-black overflow-x-hidden min-h-screen flex flex-col bg-[#030305]">

    <!-- Notificaciones flotantes UI -->
    <div id="message-box" class="fixed top-6 left-1/2 transform -translate-x-1/2 px-4 md:px-6 py-2 md:py-3 rounded-full text-[10px] md:text-xs font-black tracking-widest uppercase shadow-2xl z-[9999] opacity-0 transition-all duration-500 pointer-events-none text-center w-11/12 max-w-[350px] border border-white/10"></div>

    <!-- Fondos -->
    <div class="fixed inset-0 bg-gradient-to-b from-[#030305]/80 via-[#030305]/95 to-[#030305] -z-10"></div>
    <div class="fixed inset-0 bg-[url('/static/img/backgrounds/FONDO.png')] bg-cover bg-center opacity-5 -z-20 mix-blend-screen grayscale"></div>

    <!-- Header -->
    <header class="w-full border-b border-white/5 bg-black/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-3 md:py-4 flex justify-between items-center">
            <h1 class="text-lg md:text-xl font-black uppercase tracking-tighter block">
                <span class="text-[#FFC300]">GYM</span><span class="text-white">ENEZ</span>
            </h1>
            <a href="/apps/start/inicio.html" class="px-5 py-2 rounded-full border border-white/10 text-white font-bold text-[9px] md:text-[10px] uppercase tracking-widest hover:bg-white hover:text-black transition">
                Volver al Hub
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full px-4 md:px-6 py-8 md:py-12 flex-grow flex flex-col">
        
        <!-- Encabezado del Programa -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-6 mb-10 fade-in-up">
            <div>
                <p class="text-[#FFC300] text-[9px] font-black uppercase tracking-[0.4em] mb-1">Dossier Táctico</p>
                <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter text-white leading-none">Macro<span class="text-transparent bg-clip-text bg-gradient-to-r from-gray-300 to-gray-600">ciclo</span></h2>
            </div>
            <a href="/apps/user/workout.html" class="inline-flex items-center justify-center gap-2 btn-gold px-6 py-3.5 rounded-xl text-[10px] md:text-xs uppercase font-black tracking-[0.2em] shadow-[0_0_20px_rgba(255,195,0,0.2)] hover:scale-105 transition-transform">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                Iniciar Entrenamiento
            </a>
        </div>

        <!-- Spinner de Carga Inicial -->
        <div id="loading-spinner" class="flex flex-col items-center justify-center py-20">
            <div class="w-10 h-10 border-4 border-white/10 border-t-[#FFC300] rounded-full animate-spin mb-4"></div>
            <p class="text-gray-500 text-[10px] font-bold uppercase tracking-widest">Descifrando Planificación...</p>
        </div>

        <div id="program-container" class="hidden flex-col gap-8 w-full fade-in-up" style="animation-delay: 0.1s;">
            
            <!-- Ficha Técnica del Programa -->
            <div class="glass-panel rounded-3xl p-6 md:p-8 border-t border-white/10 bg-white/[0.02] flex flex-col md:flex-row justify-between gap-6">
                <div>
                    <span class="text-[8px] font-black text-gray-500 uppercase tracking-widest block mb-1">Estructura Activa</span>
                    <h3 id="prog-name" class="text-2xl md:text-3xl font-black uppercase tracking-tighter text-white">Cargando Plan...</h3>
                    <p id="prog-desc" class="text-gray-400 text-xs md:text-sm mt-2 max-w-2xl leading-relaxed">--</p>
                </div>
                <div class="flex gap-4 md:gap-8">
                    <div>
                        <p class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">Duración</p>
                        <p id="prog-duration" class="text-lg font-mono font-bold text-[#FFC300]">--</p>
                    </div>
                    <div>
                        <p class="text-[9px] font-black uppercase tracking-widest text-gray-500 mb-1">Nivel</p>
                        <p id="prog-level" class="text-lg font-mono font-bold text-white uppercase">--</p>
                    </div>
                </div>
            </div>

            <!-- División Semanal (Split Grid) -->
            <div>
                <h4 class="text-[10px] font-black uppercase tracking-[0.2em] text-gray-500 mb-4 ml-2">División Semanal (Split)</h4>
                <div id="weekly-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 auto-rows-auto">
                    <!-- Las tarjetas de los 7 días se generarán aquí vía JS -->
                </div>
            </div>

        </div>

    </main>

    <footer class="text-center py-6 border-t border-white/5 bg-[#030305]/80 backdrop-blur-md mt-auto">
        <p class="text-[8px] md:text-[9px] font-bold uppercase tracking-[0.4em] text-gray-600">© 2026 GYMENEZ PERFORMANCE • MASTER PLAN</p>
    </footer>

    <!-- Lógica JS -->
    <script src="/static/js/auth/auth_middleware.js"></script>
    <script src="/static/js/dashboard/routines.js"></script>
</body>
</html>
